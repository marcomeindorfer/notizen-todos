     Eintrag älter als sein eigener Grabstein und flöge gleich wieder hinaus. */
  hinweis("„"+kopie.t.slice(0,34)+(kopie.t.length>34?"…":"")+"“ gelöscht"
      +(kinder.length?" samt "+kinder.length+(kinder.length===1?" Unteraufgabe":" Unteraufgaben"):""),
    "Rückgängig",()=>{
      mut("aufgaben/"+id,{...kopie,ts:Date.now()},false);
      kinder.forEach(k=>mut("aufgaben/"+k.id,{...k.daten,ts:Date.now()},false));
      render();
    });
}
/* Aus dem Blatt der Hauptaufgabe heraus: ohne Rückfrage, dafür mit Rücknahme -
   ein einzelner Punkt ist kein Fall für einen Bestätigungsdialog. */
function unterLoeschen(elternId,id){ aufgabeLoeschen(id); aufgabeOeffnen(elternId); }

/* Was gehört in welchen Topf? */
function topfHeute(){
  const h=heute();
  const heuteAn=a=>offen(a)&&a.wann===h;
  const spaet=a=>offen(a)&&a.wann&&a.wann<h&&/^\d{4}-/.test(a.wann);
  return {
    faellig: gruppen(heuteAn),
    ueberfaellig: gruppen(spaet),
    fertig: aufListe().filter(istHeuteFertig).sort((a,b)=>b.fertig-a.fertig),
    /* Gruppen sind zum Zeigen da, die flachen Listen zum Zählen und für
       „Alle auf heute". Eine Kopfzeile ist keine Aufgabe und zählt nicht mit. */
    faelligFlach: flach(heuteAn),
    ueberFlach: flach(spaet)
  };
}

/* ===== Ziehen und Ablegen =====
   Vier Dinge haben das Ziehen bisher unberechenbar gemacht, alle vier sind hier
   behoben:
   1. Jede Berührung des Griffs war sofort ein Zug. Ein Antippen beim Scrollen
      hat dadurch die Reihenfolge verändert. Jetzt gilt erst als Zug, was sich
      auch bewegt - acht Pixel weit.
   2. Die Bewegung hing am Griff. Rutschte der Finger schneller als das Bild
      nachkam, ging der Zug verloren. Jetzt hört das Fenster mit.
   3. Ein Neuzeichnen mitten im Zug - etwa weil eine Meldung ausläuft oder das
      andere Gerät etwas schickt - hat die gezogene Zeile unter dem Finger
      ausgetauscht. Während eines Zugs wird nicht mehr gezeichnet, das
      Versäumte danach nachgeholt.
   4. Der Zielplatz wurde an der Fingerspitze gemessen. Wo man die Zeile
      angefasst hat, verschob damit das Ergebnis. Jetzt zählt die Mitte der
      gezogenen Zeile.
   Dazu neu: am Bildrand rollt die Liste mit, die Nachbarn machen sichtbar Platz,
   und Escape bricht ab. */
const DND_SCHWELLE=8;      /* so viele Pixel Weg, bevor aus Berühren ein Ziehen wird */
const DND_RAND=76;         /* ab diesem Abstand zum Bildrand rollt die Liste mit */
const DND_TEMPO=16;        /* höchstens so viele Pixel je Bild */
let dndZustand=null;       /* der laufende Zug, sonst null */
let dndSperre=false;       /* solange gezogen wird: nicht neu zeichnen */
let dndNachholen=false;    /* ein unterdrücktes Neuzeichnen wartet */
let dndKlickSperre=0;      /* der Klick unmittelbar nach dem Loslassen zählt nicht */

function dndGriff(ev,containerId,art){
  if(dndZustand) dndAufraeumen();                       /* ein hängengebliebener Zug endet hier */
  if(ev.button&&ev.button!==0) return;                  /* nur die linke Taste */
  const box=document.getElementById(containerId); if(!box) return;
  const zeile=elternMit(ev.currentTarget,"data-dnd"); if(!zeile) return;
  const kinder=[...box.children].filter(k=>k.getAttribute&&k.getAttribute("data-dnd"));
  const index=kinder.indexOf(zeile); if(index<0) return;
  if(ev.preventDefault) ev.preventDefault();
  dndZustand={art,box,zeile,kinder,index,ziel:index,aktiv:false,
    griff:ev.currentTarget, pid:ev.pointerId, rollen:0,
    startX:ev.clientX, startSeite:ev.clientY+versatzY(),
    zeigerX:ev.clientX, zeigerY:ev.clientY,
    rects:null, schritt:0, zone:null, dropWann:null};
  /* Schon ab der Berührung sperren, nicht erst wenn die 8px-Schwelle
     überschritten ist: kommt zwischen Berühren und Schwelle ein render() dazu
     (Sync-Update, ablaufender Hinweis), würden zeile/kinder/box aus dem
     Dokument gelöst - dndStarten() misst dann an bereits verwaisten Knoten
     und rechnet mit lauter Null-Rechtecken. dndAufraeumen() setzt die Sperre
     in jedem Fall zurück, auch wenn aus der Berührung nie ein Zug wurde. */
  dndSperre=true;
  addEventListener("pointermove",dndBewegen,{passive:false});
  addEventListener("pointerup",dndLoslassen,true);
  addEventListener("pointercancel",dndAbbrechen,true);
  addEventListener("keydown",dndTaste,true);
}
const versatzY=()=>(typeof scrollY==="number"?scrollY:0);
/* Nach oben suchen, aber begrenzt - oberhalb des Körpers gibt es kein getAttribute mehr */
function elternMit(el,attr,tiefe=12){
  let n=el, i=0;
  while(n&&typeof n.getAttribute==="function"&&!n.getAttribute(attr)&&i++<tiefe) n=n.parentNode;
  return (n&&typeof n.getAttribute==="function"&&n.getAttribute(attr))?n:null;
}
function dropZoneAn(x,y){
  if(!document.elementFromPoint) return null;
  const el=document.elementFromPoint(x,y);
  return el?elternMit(el,"data-drop"):null;
}
/* Erst hier wird gemessen: bis zur Schwelle kann sich das Bild noch bewegen.
   Gemessen wird in Seitenkoordinaten, damit Mitrollen nichts verzerrt. */
function dndStarten(){
  const z=dndZustand; if(!z||z.aktiv) return;
  const oben=versatzY();
  z.rects=z.kinder.map(k=>{
    const r=k.getBoundingClientRect();
    return {top:r.top+oben, hoehe:r.height, mitte:r.top+oben+r.height/2};
  });
  const eigen=z.rects[z.index];
  /* Der Schritt ist die Höhe der Zeile samt Abstand zur nächsten - so weit
     rücken die Nachbarn, wenn sie Platz machen. */
  const luecke=z.rects.length>1?Math.max(0,z.rects[1].top-(z.rects[0].top+z.rects[0].hoehe)):0;
  z.schritt=eigen.hoehe+luecke;
  z.aktiv=true; dndSperre=true; dndNachholen=false;
  z.zeile.classList.add("zieht");
  z.kinder.forEach((k,i)=>{ if(i!==z.index) k.classList.add("dnd-weicht"); });
  if(document.body&&document.body.classList) document.body.classList.add("dnd-laeuft");
  try{ z.griff.setPointerCapture(z.pid); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  dndRollen();
}
function dndBewegen(ev){
  const z=dndZustand; if(!z) return;
  z.zeigerX=ev.clientX; z.zeigerY=ev.clientY;
  if(!z.aktiv){
    const weg=Math.max(Math.abs(ev.clientY+versatzY()-z.startSeite),Math.abs(ev.clientX-z.startX));
    if(weg<DND_SCHWELLE) return;
    dndStarten();
  }
  if(ev.cancelable&&ev.preventDefault) ev.preventDefault();
  dndZeichnen();
}
function dndZeichnen(){
  const z=dndZustand; if(!z||!z.aktiv) return;
  const dy=z.zeigerY+versatzY()-z.startSeite;
  z.zeile.style.transform="translateY("+dy+"px)";
  if(z.art==="aufgabe") dndZonePruefen();
  /* Zielplatz aus der Mitte der gezogenen Zeile: wo der Finger sie gepackt hat,
     darf das Ergebnis nicht verschieben.
     Verglichen wird mit den Mitten, die die Nachbarn während des Zugs
     tatsächlich haben - alles unterhalb der gezogenen Zeile ist um eine Zeile
     aufgerückt, weil deren Platz ja frei ist. Ohne diese Verrechnung landete
     eine nach unten gezogene Zeile stets eine Stelle zu früh. */
  const mitte=z.rects[z.index].mitte+dy;
  let ziel=0;
  z.kinder.forEach((k,i)=>{
    if(i===z.index) return;
    const m=i>z.index?z.rects[i].mitte-z.schritt:z.rects[i].mitte;
    if(m<mitte) ziel++;
  });
  if(ziel===z.ziel) return;
  z.ziel=ziel;
  dndLueckeZeigen();
}
/* Die Nachbarn zwischen alter und neuer Position rücken um eine Zeile weiter -
   die Lücke wandert sichtbar mit, statt nur als Strich zu erscheinen. */
function dndLueckeZeigen(){
  const z=dndZustand; if(!z) return;
  z.kinder.forEach((k,i)=>{
    if(i===z.index) return;
    let v=0;
    if(i>z.index&&i<=z.ziel) v=-z.schritt;
    else if(i<z.index&&i>=z.ziel) v=z.schritt;
    k.style.transform=v?"translateY("+v+"px)":"";
  });
}
function dndZonePruefen(){
  const z=dndZustand; if(!z) return;
  const zone=dropZoneAn(z.zeigerX,z.zeigerY);
  const eigen=S.aufgaben[z.zeile.getAttribute("data-dnd")];
  const wann=zone?zone.getAttribute("data-drop"):null;
  /* Im eigenen Kasten wird sortiert, nicht abgelegt. Die Ablegezonen der
     Ansicht liegen um die Kästen herum - ohne diese Unterscheidung hätte eine
     Unteraufgabe beim bloßen Umsortieren den Termin des Abschnitts übernommen,
     in dem ihre Hauptaufgabe gerade steht. */
  const imEigenen=!!(zone&&z.box&&(zone===z.box||(typeof zone.contains==="function"&&zone.contains(z.box))));
  const fremd=!!(zone&&eigen&&!imEigenen&&wann!==(eigen.wann||""));
  const neu=fremd?zone:null;
  if(z.zone&&z.zone!==neu) z.zone.classList.remove("drop-an");
  if(neu&&neu!==z.zone) neu.classList.add("drop-an");
  z.zone=neu; z.dropWann=fremd?wann:null;
}
/* Am oberen und unteren Rand rollt die Liste mit, sonst kommt eine Aufgabe nie
   weiter als einen Bildschirm weit. */
function dndRollen(){
  const z=dndZustand; if(!z||!z.aktiv) return;
  if(typeof requestAnimationFrame!=="function") return;
  const hoehe=(typeof innerHeight==="number"?innerHeight:0)||600;
  let d=0;
  if(z.zeigerY<DND_RAND) d=-Math.ceil((DND_RAND-z.zeigerY)/DND_RAND*DND_TEMPO);
  else if(z.zeigerY>hoehe-DND_RAND) d=Math.ceil((z.zeigerY-(hoehe-DND_RAND))/DND_RAND*DND_TEMPO);
  if(d&&typeof scrollBy==="function"){ scrollBy(0,d); dndZeichnen(); }
  z.rollen=requestAnimationFrame(dndRollen);
}
function dndTaste(ev){ if(ev&&ev.key==="Escape") dndAbbrechen(); }
function dndAbbrechen(){
  const war=!!(dndZustand&&dndZustand.aktiv);
  dndAufraeumen();
  if(war) render();
}
/* Alles zurück auf Anfang - wird aus jedem Ende heraus aufgerufen, damit keine
   Klasse, kein Zuhörer und kein Bildlauf hängen bleibt. */
function dndAufraeumen(){
  const z=dndZustand; if(!z) return;
  dndZustand=null;
  removeEventListener("pointermove",dndBewegen);
  removeEventListener("pointerup",dndLoslassen,true);
  removeEventListener("pointercancel",dndAbbrechen,true);
  removeEventListener("keydown",dndTaste,true);
  if(z.rollen&&typeof cancelAnimationFrame==="function") cancelAnimationFrame(z.rollen);
  try{ z.griff.releasePointerCapture(z.pid); }catch(e){}
  z.zeile.style.transform="";
  z.zeile.classList.remove("zieht");
  z.kinder.forEach(k=>{ k.classList.remove("dnd-weicht"); k.style.transform=""; });
  if(z.zone) z.zone.classList.remove("drop-an");
  if(document.body&&document.body.classList) document.body.classList.remove("dnd-laeuft");
  dndSperre=false;
  if(dndNachholen){ dndNachholen=false; render(); }
}
function dndLoslassen(ev){
  const z=dndZustand; if(!z) return;
  if(!z.aktiv){ dndAufraeumen(); return; }          /* nur berührt, nicht gezogen */
  if(ev&&ev.cancelable&&ev.preventDefault) ev.preventDefault();
  const art=z.art, index=z.index, ziel=z.ziel, dropWann=z.dropWann;
  const id=z.zeile.getAttribute("data-dnd");
  const ids=z.kinder.map(k=>k.getAttribute("data-dnd"));
  dndKlickSperre=Date.now()+350;
  dndAufraeumen();
  /* In eine fremde Ablegezone gezogen: Termin ändern statt umsortieren */
  if(art==="aufgabe"&&dropWann!=null){
    const a=S.aufgaben[id];
    if(a){
      const vorher=a.wann;
      verschieben(id,dropWann||null);
      hinweis(a.t.slice(0,40)+" → "+(dropWann?datumText(dropWann):"ohne Termin"),
              "Rückgängig",()=>aufAendern(id,{wann:vorher}));
      return;
    }
  }
  if(index===ziel){ render(); return; }              /* wieder am selben Platz */
  const gezogen=ids.splice(index,1)[0];
  ids.splice(ziel,0,gezogen);
  dndUebernehmen(ids,art);
}
/* Ein Klick, der aus einem Zug hervorgeht, darf die Zeile nicht auch noch
   öffnen. Genau einer wird geschluckt, und nur direkt nach dem Loslassen. */
if(typeof addEventListener!=="undefined") addEventListener("click",ev=>{
  if(!dndKlickSperre) return;
  const frisch=Date.now()<dndKlickSperre;
  dndKlickSperre=0;
  if(!frisch) return;
  if(ev.stopPropagation) ev.stopPropagation();
  if(ev.preventDefault) ev.preventDefault();
},true);

/* Neue Reihenfolge festschreiben: gleichmäßige Abstände, damit später Platz zum Einschieben bleibt */
function dndUebernehmen(ids,art){
  const feld=art==="notiz"?"notizen":"aufgaben";
  const folge=art==="notiz"?notizFolgeGlobal(ids):ids;
  const jetzt=Date.now(), start=jetzt*100;
  const geaendert=[];
  folge.forEach((id,i)=>{
    const e=S[feld][id]; if(!e) return;
    const pos=start+i*10;
    if(e.pos===pos) return;
    setPfad(S,feld+"/"+id,{...e,pos,ts:jetzt});
    geaendert.push(id);
  });
  if(art==="notiz"&&(!S.einst||S.einst.notizSort!=="eigen")){
    setPfad(S,"einst/notizSort","eigen"); senden("einst/notizSort","eigen");
  }
  schreibenLokal();
  geaendert.forEach(id=>senden(feld+"/"+id,S[feld][id]));
  render();
  /* Wurde im Blatt sortiert, zeigt render() nur die Seite dahinter neu.
     Das Blatt selbst stünde sonst noch in der alten Reihenfolge da. */
  if(offenAuf&&S.aufgaben[offenAuf]&&document.getElementById("sheet")
     &&document.getElementById("sheet").innerHTML) aufgabeOeffnen(offenAuf);
}
/* Notizen stehen bei zeitlicher Sortierung in mehreren Kästen. Damit die neue
   Ordnung auch global stimmt, wird die sichtbare Gesamtreihenfolge genommen und
   nur der bewegte Abschnitt darin ersetzt - Platz für Platz. */
function notizFolgeGlobal(ids){
  if(!document.querySelectorAll) return ids;
  const alle=[...document.querySelectorAll(".notizreihe[data-dnd]")].map(k=>k.getAttribute("data-dnd"));
  if(!alle.length) return ids;
  const drin=new Set(ids);
  let i=0;
  return alle.map(x=>drin.has(x)?(i<ids.length?ids[i++]:x):x);
}

function aufZeile(a,opt={}){
  const k=a.kat?kat(a.kat):null;
  const h=heute();
  const spaet=!a.fertig&&a.wann&&/^\d{4}-/.test(a.wann)&&a.wann<h;
  const meta=[];
  if(k) meta.push(`<span class="mini"><i class="punkt" style="background:${k.f}"></i> ${esc(k.n)}</span>`);
  if(opt.datum&&a.wann){
    if(a.wann==="woche") meta.push(`<span class="mini">Diese Woche</span>`);
    else if(a.wann==="danach") meta.push(`<span class="mini">Danach</span>`);
    else meta.push(`<span class="mini ${spaet?"spaet":""}">${spaet?"seit ":""}${datumText(a.wann)}</span>`);
  }
  if(a.wdh) meta.push(`<span class="mini">${esc(wdhText(a))}</span>`);
  /* Was lange ohne Termin im Vorrat liegt, sagt das leise selbst -
     die ruhige Variante einer Erinnerung, ganz ohne Benachrichtigung. */
  if(!a.fertig&&!a.wann&&a.erstellt){
    const tage=Math.floor((Date.now()-a.erstellt)/TAG_MS);
    if(tage>=LIEGT_AB) meta.push(`<span class="mini liegt">liegt seit ${tage} Tagen</span>`);
  }
  if(a.fertig&&a.von) meta.push(`<span class="mini">✓ ${esc(a.von)}</span>`);
  if(a.herkunft) meta.push(`<span class="mini" style="color:var(--akz)">von ${esc(a.herkunft)}</span>`);
  /* Steht eine Unteraufgabe einmal für sich - in der Suche, im Erledigten, im
     Wochentopf -, gehört ihr Zusammenhang an die Zeile. */
  const oben=hauptVon(a);
  if(oben&&!opt.ohneEltern) meta.push(`<span class="mini">↳ ${esc(oben.t.slice(0,40))}</span>`);
  /* Der Fortschritt ist zugleich der Schalter: ein Tipp klappt die Punkte auf. */
  const kinder=opt.ohneKinder?[]:kinderVon(a.id);
  const offK=kinder.filter(offen).length;
  const auf=!!offeneUnter[a.id];
  if(kinder.length) meta.push(`<button class="ufort ${offK?"":"voll"}" aria-expanded="${auf}"
      aria-label="Unteraufgaben ${auf?"zuklappen":"aufklappen"}"
      onclick="event.stopPropagation();unterKlappen('${a.id}')"><span class="pf">▸</span>${kinder.length-offK}/${kinder.length}</button>`);
  /* Der Griff ist immer da - Ziehen soll ohne Umschalten funktionieren.
     Die ganze Zeile öffnet die Bearbeitung; Haken und Griff halten das Ereignis auf. */
  const griff=opt.sort?`<button class="griff" onpointerdown="dndGriff(event,'${opt.box}','aufgabe')" onclick="event.stopPropagation()" aria-label="Verschieben">${GRIFF}</button>`:"";
  /* Der häufigste Handgriff des Tages - aus dem Vorrat oder aus dem Überfälligen
     in den Tag - soll ein Tipp sein, nicht drei. */
  const schnellZiel=opt.schnell&&!a.fertig
    ? `<div class="zeilentakt">
         ${a.wann!==h?`<button class="ztakt" onclick="event.stopPropagation();verschieben('${a.id}','${h}')" aria-label="Auf heute">Heute</button>`:""}
         ${a.wann!==morgen()?`<button class="ztakt" onclick="event.stopPropagation();verschieben('${a.id}','${morgen()}')" aria-label="Auf morgen">Morgen</button>`:""}
       </div>`
    : "";
  /* Die Kennung des Kastens hängt an der Aufgabe, nicht an einem Zähler: nur so
     findet das Eingabefeld nach dem Neuzeichnen den Fokus wieder. Je Ansicht
     steht eine Hauptaufgabe genau einmal, doppelt kann die Kennung nicht werden. */
  const ubox="ubox_"+a.id;
  const unterBlock=(kinder.length&&auf)
    ? `<div class="unter" id="${ubox}">${kinder.map(u=>unterZeile(u,ubox)).join("")}</div>
       <div class="uneu">
         <input type="text" id="un_${a.id}" placeholder="Unteraufgabe …" onclick="event.stopPropagation()"
           onkeydown="event.stopPropagation();if(event.key==='Enter')unterAnlegen('${a.id}','un_${a.id}')">
         <button class="btn" onclick="event.stopPropagation();unterAnlegen('${a.id}','un_${a.id}')" aria-label="Unteraufgabe anlegen">+</button></div>`
    : "";
  return `<div class="auf ${a.fertig?"fertig":""} ${spaet&&!a.fertig?"ueber":""} ${unterBlock?"aufgeklappt":""}" data-dnd="${a.id}" onclick="aufgabeOeffnen('${a.id}')">
    <button class="hak" id="hak_${a.id}" onclick="event.stopPropagation();haken('${a.id}')" aria-label="${a.fertig?"Wieder öffnen":"Erledigt"}">
      <svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg></button>
    <div class="auf-txt">${esc(a.t)}
      ${meta.length?`<div class="auf-meta">${meta.join("")}</div>`:""}
      ${a.notiz?`<div class="auf-notiz">${esc(a.notiz)}</div>`:""}
      ${schnellZiel}${unterBlock}</div>
    ${griff}
  </div>`;
}
/* Die Unteraufgabe in der aufgeklappten Zeile: schmaler als eine Aufgabenzeile,
   aber mit allem, was man im Vorbeigehen braucht - Haken, Termin, Liste, Griff.
   Alles Weitere steht in ihrem eigenen Blatt, das ein Tipp öffnet. */

  const meta=[];
  if(k) meta.push(`<span class="mini"><i class="punkt" style="background:${k.f}"></i> ${esc(k.n)}</span>`);
  if(u.wann) meta.push(`<span class="mini ${spaet?"spaet":""}">${

  if(u.wdh) meta.push(`<span class="mini">${esc(wdhText(u))}</span>`);

  return `<div class="uzeile ${u.fertig?"fertig":""}" data-dnd="${u.id}" onclick="event.stopPropagation();aufgabeOeffnen('${u.id}')">
    <button class="uhak" id="uhak_${u.id}" onclick="event.stopPropagation();haken('${u.id}')" aria-label="${u.fertig?"Wieder öffnen":"Erledigt"}">
      <svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg></button>

/* Aus Gruppen wird Html. Zuerst die Hauptaufgaben, die selbst hier anstehen, in
   einem gemeinsamen Kasten - dort lässt sich umsortieren wie bisher. Danach je
   Kopfzeile ein eigener Kasten: quer über zwei Themen zu ziehen ergäbe keine
   Reihenfolge, die irgendwo hinführt. */
function gruppenHtml(liste,opt={}){
  const eigene=liste.filter(g=>g.eigen).map(g=>g.haupt);

          + aufListeHtml(g.treffer,{...opt,ohneEltern:true});

}

function schnellOeffnen(){

  const koerper=()=>`<div class="sheet-kopf"><h2>Schnell eintragen</h2>

    <div class="schnell" style="margin-top:8px">
      <input type="text" id="schnellfeld" placeholder="Aufgabe eintippen …"
        onkeydown="if(event.key==='Enter')schnellAnlegen()">
      <button class="btn btn-primary" onclick="schnellAnlegen()">+</button></div>
    ${cfg.partner?`<div class="chips" style="padding-bottom:4px">
      ${[["mir","Bei mir"],["partner","Bei "+cfg.partner.name]].map(([w,l])=>`<button class="chip" aria-pressed="${schnellBei===w}"
        onclick="schnellBeiWaehlen(this,'${w}')">${esc(l)}</button>`).join("")}</div>`:""}
    <div class="chips" style="padding-bottom:4px">
      ${SCHNELL_ZIELE.map(([w,l])=>`<button class="chip" aria-pressed="${schnellWohin===w}"
        onclick="schnellZiel(this,'${w}')">${l}</button>`).join("")}</div>
    <div class="chips" style="padding-bottom:4px">
      ${SCHNELL_WDH.map(([w,l])=>`<button class="chip" aria-pressed="${schnellWdh===w}"
        onclick="schnellRhythmus(this,'${w}')">${l}</button>`).join("")}</div>
    <p class="note" style="margin-top:10px">${cfg.partner?`Bei „Bei ${esc(cfg.partner.name)}“ gewählt: Datum und Wiederholung unten werden nicht übernommen, die Aufgabe landet einfach in ihrer/seiner Liste „Von …“. `:""}„morgen", „Freitag", „14.9.", „#Geburt", „alle 3 Wochen" oder „jeden Montag" mitschreiben, das schlägt die Auswahl hier.</p>
    <button class="btn btn-primary btn-wide fertig-knopf" onclick="closeSheet()">Fertig</button>`;
  openSheet(koerper(),true);
  setTimeout(()=>{const e=document.getElementById("schnellfeld"); if(e&&e.focus)e.focus();},60);
}
/* Nur die Auswahl umschalten, nicht das ganze Blatt neu bauen: sonst war das
   halb Getippte weg, sobald man das Ziel gewechselt hat. */
function schnellZiel(el,wohin){
  schnellWohin=wohin;
  schnellReihe(el);
}
function schnellBeiWaehlen(el,w){
  schnellBei=w;
  schnellReihe(el);
}
function schnellRhythmus(el,w){
  schnellWdh=w;
  schnellReihe(el);
}
function schnellReihe(el){
  const reihe=el&&el.parentNode;
  if(reihe&&reihe.querySelectorAll) reihe.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===el)));
  const f=document.getElementById("schnellfeld"); if(f&&f.focus)f.focus();
}
function schnellAnlegen(){
  const el=document.getElementById("schnellfeld"); if(!el) return;
  const t=el.value; if(!t.trim()) return;
  el.value="";
  if(schnellBei==="partner"&&cfg.partner){
    aufgabeFuerPartner(t);
    const neu=document.getElementById("schnellfeld"); if(neu&&neu.focus)neu.focus();
    return;
  }
  const wann=schnellWohin==="heute"?heute():schnellWohin==="morgen"?morgen():schnellWohin==="woche"?"woche":null;
  aufgabeAnlegen(t,wann,null,null,schnellWdh?{wdh:schnellWdh}:null);
  hinweis(schnellWdh?"Eingetragen, wiederholt sich "+WDH[schnellWdh].toLowerCase()+".":"Eingetragen.");
  const neu=document.getElementById("schnellfeld"); if(neu&&neu.focus)neu.focus();
}

/* ---------- Heute: schneller Zugriff auf Notizen ---------- */
function heuteNotizen(){
  const alle=Object.entries(S.notizen||{}).map(([id,n])=>({...n,id})).filter(n=>!n.archiv);
  if(!alle.length) return "";
  const zeit=n=>Math.max(n.geoeffnet||0,n.geaendert||0,n.erstellt||0);
  const oben=alle.filter(n=>n.oben).sort((a,b)=>zeit(b)-zeit(a));
  const rest=alle.filter(n=>!n.oben).sort((a,b)=>zeit(b)-zeit(a));
  const liste=oben.concat(rest).slice(0,5);
  return `<div class="sect"><h2>Notizen</h2><span class="zahl">${oben.length?oben.length+" angeheftet":"zuletzt genutzt"}</span>
      <button class="btn btn-s" onclick="go('notizen')">Alle</button></div>
    <div class="notizspur">${liste.map(n=>{
      const k=n.kat?kat(n.kat):null;
      return `<button class="nspur" onclick="notizOeffnen('${n.id}')" style="border-left-color:${k?k.f:"var(--line-2)"}">
        <b>${n.oben?'<span style="color:var(--akz)">▲ </span>':""}${esc(n.titel||"Ohne Titel")}</b>
        <span>${esc(textAus(n.html).slice(0,70)||"Leer")}</span></button>`;}).join("")}</div>`;
}

/* ---------- Heute: was diese Woche noch ansteht ----------
   Der Topf „Diese Woche, ohne festen Tag" lebte bisher nur in der Wochenansicht.
   Wer morgens auf „Heute" schaut, hat ihn dadurch nie gesehen. */
function wochenTopf(){
  const liste=flach(a=>!a.fertig&&a.wann==="woche");
  if(!liste.length) return "";
  const zeigen=liste.slice(0,3), rest=liste.length-zeigen.length;
  return `<div class="sect"><h2>Diese Woche noch</h2><span class="zahl">${liste.length}</span>
      <button class="btn btn-s" onclick="go('woche')">Woche</button></div>
    ${zeigen.map(a=>{
      const k=a.kat?kat(a.kat):null;
      const oben=hauptVon(a);
      return `<div class="topfzeile" onclick="aufgabeOeffnen('${a.id}')">
        ${k?`<i class="punkt" style="background:${k.f}"></i>`:""}
        <span>${esc(a.t)}${oben?` <span class="mini">↳ ${esc(oben.t.slice(0,22))}</span>`:""}</span>
        <button class="ztakt rest" onclick="event.stopPropagation();verschieben('${a.id}','${heute()}')">Heute</button>
      </div>`;}).join("")}
    ${rest>0?`<p class="note" style="margin:2px 0 8px">und ${rest} weitere unter „Woche".</p>`:""}`;
}

/* ---------- Heute: Vorschau auf morgen, zugleich Ablegezone ---------- */
function morgenBlock(){
  const m=morgen();
  const passt=a=>!a.fertig&&a.wann===m;
  const g=gruppen(passt);
  return `<div class="sect"><h2>Morgen</h2><span class="zahl">${flach(passt).length}</span>
      <button class="btn btn-s" onclick="schnellFuer('${m}')">Eintragen</button></div>
    <div class="morgenzone" data-drop="${m}">
      ${g.length?gruppenHtml(g):`<div class="leer">Noch nichts. Zieh eine Aufgabe am Griff hierher.</div>`}
    </div>`;
}

/* ---------- Heute ---------- */
function vHeute(){
  const {faellig,ueberfaellig,fertig,faelligFlach,ueberFlach}=topfHeute();
  const ges=faelligFlach.length+ueberFlach.length+fertig.length;
  const anteil=ges?Math.round(fertig.length/ges*100):0;
  const bogen=`<div class="bogen ${ges&&fertig.length===ges?"voll":""}">
    <div class="bogen-kopf"><b>${ges?(fertig.length===ges?"Alles erledigt":fertig.length+" von "+ges+" erledigt"):"Noch nichts geplant"}</b>
      <span>${new Date().getDate()}. ${MONATE[new Date().getMonth()].toUpperCase()} · ${kw()}</span>
      <button class="ikon" onclick="naechsteWoche()" aria-label="Nächste Woche ansehen" title="Nächste Woche">${ICON_WOCHE_VOR}</button></div>
    <div class="balken"><i style="width:${anteil}%"></i></div></div>`;

  const nichts=!faellig.length&&!ueberfaellig.length&&!fertig.length
    ? `<div class="leerzustand"><b>Der Tag ist frei</b>Trag oben etwas ein oder hol dir unter Listen eine Aufgabe aus einem deiner Vorräte.
       <div style="margin-top:14px"><button class="btn" onclick="go('listen')">Zu den Listen</button></div></div>` : "";

  /* Überfälliges lässt sich dort aufräumen, wo es auftaucht - statt drei
     Ansichten weiter unter „Mehr". */
  const ueberKopf=ueberfaellig.length
    ? `<div class="sect"><h2>Überfällig</h2><span class="zahl">${ueberFlach.length}</span>
         <button class="btn btn-s" onclick="ueberfaelligHolen()">Alle auf heute</button></div>
       ${gruppenHtml(ueberfaellig,{datum:true,schnell:true})}`
    : "";

  return bogen + `<div style="margin-top:14px"></div>` + schnellFeld(heute(),null)
    + ueberKopf
    + (faellig.length?`<div class="sect"><h2>Für heute</h2><span class="zahl">${faelligFlach.length}</span></div>
        <div data-drop="${heute()}">${gruppenHtml(faellig)}</div>`:`<div data-drop="${heute()}"></div>`)
    + nichts
    + wochenTopf()
    + morgenBlock()
    + heuteNotizen()
    + (fertig.length?`<div class="sect"><h2>Heute geschafft</h2><span class="zahl">${fertig.length}</span></div>
       ${fertig.map(a=>aufZeile(a,{})).join("")}`:"");
}

/* ---------- Woche ---------- */
function vWoche(){
  const tage=wochenTage(wochenVersatz);
  const alle=aufListe();
  const inWoche=a=>a.wann&&tage.includes(a.wann);
  const kopf=`<div class="row-btns" style="margin-bottom:12px">
      <button class="btn btn-s" onclick="wochenVersatz--;render()">‹</button>
      <button class="btn btn-s" style="flex:1;text-align:center" onclick="wochenVersatz=0;render()">
        ${wochenVersatz===0?"Diese Woche":wochenVersatz===1?"Nächste Woche":wochenVersatz===-1?"Letzte Woche":kw(wochenStart(wochenVersatz))}
        · ${kw(wochenStart(wochenVersatz))}</button>
      <button class="btn btn-s" onclick="wochenVersatz++;render()">›</button></div>`;

  const bloecke=tage.map(d=>{
    const offenAmTag=a=>a.wann===d&&!a.fertig;
    const gOffen=gruppen(offenAmTag);
    const offeneT=flach(offenAmTag);
    const erledigtT=alle.filter(a=>a.wann===d&&a.fertig).sort((x,y)=>(y.fertig||0)-(x.fertig||0));
    const fertigT=erledigtT.length;
    const zeigErledigt=wocheFertig&&fertigT;
    const inhalt=gruppenHtml(gOffen)+(zeigErledigt?aufListeHtml(erledigtT):"");
    return `<div class="tagblock ${d===heute()?"heute":""}">
      <div class="tagblock-h"><b>${TAGE[wochentag(d)]}${d===heute()?" · heute":""}</b>
        <span>${ausIso(d).getDate()}.${ausIso(d).getMonth()+1}.${offeneT.length?" · "+offeneT.length+" OFFEN":""}${fertigT?" · "+fertigT+" ERLEDIGT":""}</span></div>
      ${gOffen.length||zeigErledigt?inhalt:`<div class="leer">frei - <button class="btn btn-ghost btn-s" style="padding:0" onclick="schnellFuer('${d}')">etwas eintragen</button></div>`}
    </div>`;}).join("");

  const wochePasst=a=>!a.fertig&&a.wann==="woche";
  const danachPasst=a=>!a.fertig&&a.wann==="danach";
  const wocheOffen=gruppen(wochePasst), danach=gruppen(danachPasst);

  const erledigtGes=alle.filter(a=>a.fertig&&tage.includes(a.wann)).length;
  return kopf
    + `<div class="row-btns" style="margin-bottom:10px">
        <button class="btn btn-s" onclick="wocheFertig=!wocheFertig;render()">${wocheFertig?"Erledigte ausblenden":"Erledigte einblenden"}${erledigtGes?" ("+erledigtGes+")":""}</button></div>`
    + bloecke
    + `<div class="sect"><h2>Diese Woche, ohne festen Tag</h2><span class="zahl">${flach(wochePasst).length}</span></div>`
    + (wocheOffen.length?gruppenHtml(wocheOffen):`<p class="note" style="margin-bottom:10px">Nichts offen.</p>`)
    + schnellFeld("woche",null)
    + `<div class="sect"><h2>Danach</h2><span class="zahl">${flach(danachPasst).length}</span></div>`
    + (danach.length?gruppenHtml(danach):`<p class="note">Nichts vorgemerkt.</p>`);
}
/* Ein Tipp von „Heute" in die kommende Woche, ohne den Umweg über die
   Wochenansicht und deren Pfeile. */
function naechsteWoche(){ wochenVersatz=1; go("woche"); }
function schnellFuer(d){
  offenAuf=null;
  openSheet(`<div class="sheet-kopf"><h2>Aufgabe für ${datumText(d)}</h2>
      <button class="btn btn-ghost btn-s" onclick="closeSheet()" aria-label="Schließen">✕</button></div>
    <div class="schnell" style="margin-top:12px">
      <input type="text" id="neublatt" placeholder="Aufgabe …" onkeydown="if(event.key==='Enter')neuAnlegen('${d}','','neublatt')">
      <button class="btn btn-primary" onclick="neuAnlegen('${d}','','neublatt')">+</button></div>
    <p class="note" style="margin:2px 0 0">Mehrere hintereinander gehen auch, das Blatt bleibt offen.</p>
    <button class="btn btn-primary btn-wide fertig-knopf" onclick="closeSheet()">Fertig</button>`);
  setTimeout(()=>{const e=document.getElementById("neublatt");if(e&&e.focus)e.focus();},60);
}

/* ---------- Listen (Vorräte ohne Datum) ---------- */
function vListen(){
  const alle=aufListe();
  const ohneDatum=a=>!a.fertig&&!a.wann;
  const katsSortiert=Object.entries(S.kategorien).sort((a,b)=>(a[1].pos||0)-(b[1].pos||0));
  /* In dieser Ansicht zählt die geerbte Liste, siehe listeVon() */
  const inListe=(a,id)=>ohneDatum(a)&&listeVon(a)===id;
  const offenZahl=id=>alle.filter(a=>inListe(a,id)).length;
  /* Die Listen stehen als Reiter direkt oben. Vorher kostete jeder Wechsel drei
     Handgriffe: Blatt öffnen, wählen, schließen. */
  const chips=`<div class="chips" style="padding-bottom:10px">
    <button class="chip" aria-pressed="${katFilter==="alle"}" onclick="katFilter='alle';render()">Alle<span class="anz">${alle.filter(a=>ohneDatum(a)).length}</span></button>
    ${katsSortiert.map(([id,kk])=>`<button class="chip" aria-pressed="${katFilter===id}" onclick="katFilter='${id}';render()"><i class="punkt" style="background:${kk.f}"></i>${esc(kk.n)}<span class="anz">${offenZahl(id)}</span></button>`).join("")}
    <button class="chip" onclick="katVerwalten()" aria-label="Listen verwalten" title="Listen verwalten">⚙</button></div>`;
  const zeigen=katsSortiert.filter(([id])=>katFilter==="alle"||katFilter===id);
  const bloecke=zeigen.map(([id,k])=>{
    const g=gruppen(a=>inListe(a,id));
    const notizZahl=Object.values(S.notizen||{}).filter(n=>n.kat===id&&!n.archiv).length;
    return `<div class="sect"><h2><i class="punkt" style="background:${k.f}"></i> ${esc(k.n)}</h2>
        <span class="zahl">${offenZahl(id)} offen${notizZahl?" · "+notizZahl+(notizZahl===1?" Notiz":" Notizen"):""}</span></div>
      ${g.length?gruppenHtml(g,{schnell:true}):`<p class="note" style="margin-bottom:8px">Noch nichts gesammelt.</p>`}
      <div class="schnell" style="margin-bottom:14px">
        <input type="text" id="neu_${id}" placeholder="In „${esc(k.n)}“ sammeln …"
          onkeydown="if(event.key==='Enter')sammeln('${id}')">
        <button class="btn" onclick="sammeln('${id}')">+</button></div>`;
  }).join("");

  const ohnePasst=a=>ohneDatum(a)&&!listeVon(a);
  const ohneListe=gruppen(ohnePasst);
  /* Beide Blöcke stehen immer im Dokument, nur per hidden umgeschaltet -
     dadurch bleibt #asuche beim Tippen unangetastet und muss nicht extra neu
     fokussiert werden, siehe aufSucheAendern(). */
  const suchAktiv=!!aufSuche.trim();
  return sucheFeld()
    + `<div id="listeninhalt"${suchAktiv?" hidden":""}>` + chips + bloecke
      + (ohneListe.length&&katFilter==="alle"
        ? `<div class="sect"><h2>Ohne Liste</h2><span class="zahl">${flach(ohnePasst).length}</span></div>${gruppenHtml(ohneListe,{schnell:true})}`:"")
      + `</div>`
    + `<div id="suchtreffer"${suchAktiv?"":" hidden"}>${suchAktiv?sucheTreffer():""}</div>`;
}
function listenFilterWaehlen(){
  const alle=aufListe(), ohneDatum=a=>!a.fertig&&!a.wann;
  const kats=Object.entries(S.kategorien).sort((a,b)=>(a[1].pos||0)-(b[1].pos||0));
  openSheet(`<div class="sheet-kopf"><h2>Liste wählen</h2>
      <button class="btn btn-ghost btn-s" onclick="closeSheet()">✕</button></div>
    <button class="wahlzeile" aria-pressed="${katFilter==="alle"}" onclick="katFilter='alle';closeSheet()">Alle Listen<span class="anz">${alle.filter(ohneDatum).length}</span></button>
    ${kats.map(([id,k])=>`<button class="wahlzeile" aria-pressed="${katFilter===id}" onclick="katFilter='${id}';closeSheet()">
      <i class="punkt" style="background:${k.f}"></i>${esc(k.n)}
      <span class="anz">${alle.filter(a=>ohneDatum(a)&&a.kat===id).length}</span></button>`).join("")}
    <button class="btn btn-wide" style="margin-top:14px" onclick="closeSheet();katVerwalten()">Listen verwalten</button>`);
}
function sucheFeld(){
  return `<div class="schnell"><input type="search" id="asuche" placeholder="Aufgaben und Notizen durchsuchen …" value="${esc(aufSuche)}" oninput="aufSucheAendern(this.value)">
    ${aufSuche?`<button class="btn" onclick="aufSuche='';render()">✕</button>`:""}</div>`;
}
/* Eine Suche über beides: für etwas, das „Marco's brain" heißt, ist die Trennung
   zwischen Aufgaben- und Notizsuche die unpassendere Idee. */
function sucheTreffer(){
  const q=normText(aufSuche);
  const aufgaben=aufListe().filter(a=>normText(a.t).includes(q)||(a.notiz&&normText(a.notiz).includes(q)))
    .sort((a,b)=>(a.fertig?1:0)-(b.fertig?1:0)||(b.erstellt||0)-(a.erstellt||0));
  const notizen=notizenSuchen(aufSuche,"alle");
  if(!aufgaben.length&&!notizen.length)
    return `<div class="leerzustand"><b>Nichts gefunden</b>Gesucht wird in Aufgaben samt Notizfeld - auch im Erledigten - und in allen Notizen samt Archiv.</div>`;
  return (aufgaben.length?`<div class="sect"><h2>Aufgaben</h2><span class="zahl">${aufgaben.length}</span></div>`
      +aufgaben.slice(0,40).map(a=>aufZeile(a,{datum:true})).join(""):"")
    +(notizen.length?`<div class="sect"><h2>Notizen</h2><span class="zahl">${notizen.length}</span></div>`
      +notizen.slice(0,20).map(n=>{
        const k=n.kat?kat(n.kat):null;
        return `<button class="nspur" style="display:block;width:100%;text-align:left;margin-bottom:7px;border-left-color:${k?k.f:"var(--line-2)"}"
          onclick="notizOeffnen('${n.id}')">
          <b>${n.archiv?'<span class="mini">Archiv · </span>':""}${esc(n.titel||"Ohne Titel")}</b>
          <span>${ausschnitt(n,aufSuche)}</span></button>`;}).join(""):"");
}
/* Nur den Trefferblock austauschen, nie das ganze #view: ein vollständiges
   Neuzeichnen bei jedem Buchstaben lässt auf dem Handy die Tastatur zucken
   und den Cursor springen. #listeninhalt und #suchtreffer stehen beide immer
   im Dokument (vListen()), hier wird nur zwischen ihnen umgeschaltet. */
function aufSucheAendern(v){
  aufSuche=v;
  const treffer=document.getElementById("suchtreffer"), inhalt=document.getElementById("listeninhalt");
  if(!treffer||!inhalt){ render(); return; }   /* Sicherheitsnetz, falls die Struktur fehlt */
  const aktiv=!!v.trim();
  inhalt.hidden=aktiv;
  treffer.hidden=!aktiv;
  if(aktiv) treffer.innerHTML=sucheTreffer();
}
function sammeln(katId){
  const el=document.getElementById("neu_"+katId); if(!el||!el.value.trim())return;
  const t=el.value; el.value="";
  aufgabeAnlegen(t,null,katId);
  const neu=document.getElementById("neu_"+katId); if(neu&&neu.focus)neu.focus();
}

/* ---------- Aufgabe bearbeiten ----------
   Titel und Notiz speicherten bisher bei jedem Tastendruck einzeln - anders
   als der Notizeditor (notizMerken(), 600ms), der genau das schon vermeidet.
   Bei größeren Beständen bremste das spürbar, weil jede Änderung den
   gesamten Zustand serialisiert und in die Warteschlange stellt. Gleiches
   Muster wie dort: erst 400ms nach der letzten Eingabe wirklich schreiben. */
let aufSpeicherTimer=null;
function aufgabeMerken(id){
  clearTimeout(aufSpeicherTimer);
  aufSpeicherTimer=setTimeout(()=>aufgabeMerkenSofort(id),400);
}
function aufgabeMerkenSofort(id){
  if(!S.aufgaben[id]) return;
  const txt=document.getElementById("atxt"), notiz=document.getElementById("anotiz");
  const felder={};
  if(txt) felder.t=txt.value.trim()||"Ohne Titel";
  if(notiz) felder.notiz=notiz.value.trim()||null;
  if(Object.keys(felder).length) aufAendern(id,felder,false);
}
function aufgabeOeffnen(id){
  const a=S.aufgaben[id]; if(!a) return;
  offenAuf=id;                       /* damit das Blatt nach dem Ziehen mitkommt */
  const body=()=>{
    const b=S.aufgaben[id]; if(!b) return "";
    const wannIst=w=>b.wann===w;
    const festesDatum=/^\d{4}-/.test(b.wann||"");
    const oben=hauptVon(b);
    const kinder=oben?[]:kinderVon(id);
    const fertigK=kinder.filter(x=>x.fertig).length;
    return `<div class="sheet-kopf"><h2>${oben?"Unteraufgabe":"Aufgabe"}</h2>
        <button class="btn btn-ghost btn-s" onclick="closeSheet()" aria-label="Schließen">✕</button></div>
      <textarea id="atxt" rows="2" oninput="aufgabeMerken('${id}')">${esc(b.t)}</textarea>
      ${oben?`<button class="btn btn-s btn-wide" style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px"
            onclick="aufgabeOeffnen('${b.eltern}')">${ICON_UNTER}gehört zu „${esc(oben.t.slice(0,38))}“</button>`
        :`<label class="fl">Unteraufgaben</label>
      ${kinder.length?`<p class="note" style="margin:0 0 5px">${fertigK} von ${kinder.length} erledigt</p>
        <div class="ubalken"><i style="width:${Math.round(fertigK/kinder.length*100)}%"></i></div>
        <div id="sbox_${id}">${kinder.map(u=>`
          <div class="usheet ${u.fertig?"fertig":""}" data-dnd="${u.id}">

   und der Finger soll im Feld bleiben, um gleich den nächsten zu tippen. */

  if(!unterAnlegen(id,"usheet_"+id)) return;
  aufgabeOeffnen(id);
  setTimeout(()=>{const e=document.getElementById("usheet_"+id); if(e&&e.focus)e.focus();},60);

   genügt dafür, ein ganzes Verknüpfungssystem braucht es nicht. */
function notizZuAufgabe(id){
  const a=S.aufgaben[id]; if(!a) return;

  mut("notizen/"+nid,{titel:a.t.slice(0,60),html:"",kat:a.kat||null,art:"frei",archiv:false,oben:false,

function aufgabeZuNotiz(nid){

function verdoppeln(id){
  const a=S.aufgaben[id]; if(!a)return;
  const neuId="a"+id6();

};
let offeneNotiz=null, speicherTimer=null;

const textAus=h=>entziffern(String(h||"").replace(/<br\s*\/?>/gi," ").replace(/<\/(p|div|li|h\d)>/gi," ").replace(/<[^>]+>/g," "))
  .replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
/* Notizen dürfen Auszeichnung enthalten, aber nichts Ausführbares. Der Inhalt kommt
   aus dem Editor, aus geteilten Seiten und aus dem Google-Import - überall kann
   fremdes HTML mitkommen, und es landet anschließend wieder in einem Element. */
const SCHEMA_ERLAUBT=/^(?:https?|mailto|tel):/i;
const BILD_ERLAUBT=/^data:image\/(?:png|jpe?g|gif|webp);base64,/i;
/* „java&#115;cript:" wäre erst im Browser wieder ein Schema - deshalb werden
   Entities und unsichtbare Zeichen vor der Prüfung aufgelöst. */
function adresseSicher(wert){
  const roh=String(wert)
    .replace(/&#x([0-9a-f]+);?/gi,(_,h)=>String.fromCharCode(parseInt(h,16)))
    .replace(/&#(\d+);?/g,(_,d)=>String.fromCharCode(+d))
    .replace(/[\s\u0000-\u001f\u007f]/g,"");
  if(!/^[a-z][a-z0-9+.-]*:/i.test(roh)) return true;            /* relative Adresse */
  return SCHEMA_ERLAUBT.test(roh)||BILD_ERLAUBT.test(roh);
}
const BOESE_TAGS="script|style|iframe|frame|frameset|object|embed|applet|link|meta|base|form|input|button|noscript";
const sauberHtml=h=>String(h||"")
  .replace(new RegExp("<\\s*("+BOESE_TAGS+")\\b[\\s\\S]*?<\\s*/\\s*\\1\\s*>","gi"),"")
  .replace(new RegExp("<\\s*/?\\s*(?:"+BOESE_TAGS+")\\b[^>]*>","gi"),"")
  /* Ereignis-Attribute - auch wenn sie mit / oder Umbruch statt Leerzeichen abgetrennt sind */
  .replace(/[\s/]on\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]*)/gi,"")
  /* Adressen, die Code ausführen könnten. Eingefügte Bilder als data: bleiben erlaubt. */
  .replace(/\s(href|src|xlink:href|action|formaction)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi,
    (treffer,attr,a,b,c)=>adresseSicher(a!==undefined?a:(b!==undefined?b:(c||"")))?treffer:"");

/* ---------- Suche: Wortweise, gewichtet nach Fundort ---------- */
function notizenSuchen(q,modus){
  const worte=normText(q).split("_").filter(w=>w.length>1);
  let liste=Object.entries(S.notizen||{}).map(([id,n])=>({id,...n}));
  if(modus==="archiv") liste=liste.filter(n=>n.archiv);
  else if(modus!=="alle") liste=liste.filter(n=>!n.archiv);
  if(!worte.length) return liste.sort((a,b)=>(b.geaendert||0)-(a.geaendert||0));
  return liste.map(n=>{
    const t=normText(n.titel), k=normText(kat(n.kat).n), b=normText(textAus(n.html));
    let punkte=0, alle=true;
    worte.forEach(w=>{
      let p=0;
      if(t.includes(w))p+=6;
      if(k.includes(w))p+=3;
      if(b.includes(w))p+=1+Math.min(3,(b.split(w).length-1));
      if(!p)alle=false;
      punkte+=p;
    });
    return {...n,punkte,alle};
  }).filter(n=>n.alle).sort((a,b)=>b.punkte-a.punkte||(b.geaendert||0)-(a.geaendert||0));
}
/* Ausschnitt rund um den ersten Treffer, Fundstellen hervorgehoben */
function ausschnitt(n,q){
  const roh=textAus(n.html);
  const worte=q.trim().split(/\s+/).filter(w=>w.length>1);
  let start=0;
  if(worte.length){
    const i=roh.toLowerCase().indexOf(worte[0].toLowerCase());
    if(i>60) start=i-40;
  }
  let s=(start?"… ":"")+roh.slice(start,start+180)+(roh.length>start+180?" …":"");
  s=esc(s);
  worte.forEach(w=>{ s=s.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>"); });
  return s||"<i>Leer</i>";
}

const ICON_STIFT_N='<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 6.5l4 4"/></svg>';
const ICON_WEG_N='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
const ICON_NADEL='<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-3 4h10l-3-4V3M12 13v8"/></svg>';
const ICON_ARCHIV='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>';

const SORTEN={erstellt:"Neueste zuerst",geoeffnet:"Zuletzt geöffnet",geaendert:"Zuletzt geändert",eigen:"Eigene Reihenfolge"};
const notizSortierung=()=>{const s=(S.einst&&S.einst.notizSort)||"erstellt";return SORTEN[s]?s:"erstellt";};
const notizPos=n=>n.pos||n.erstellt||0;
/* Für jede Sortierung der passende Zeitstempel. Werte vor dem Jahr 2000 stammen
   aus fehlerhaften Importen und werden übersprungen, sonst landet alles in „1970“. */
const zeitOk=t=>typeof t==="number"&&t>946684800000;
function sortWert(n,art){
  const kette=art==="geoeffnet"?[n.geoeffnet,n.geaendert,n.erstellt]
            :art==="geaendert"?[n.geaendert,n.erstellt,n.geoeffnet]
            :[n.erstellt,n.geaendert,n.geoeffnet];
  for(const t of kette) if(zeitOk(t)) return t;
  return 0;
}
function notizenGeordnet(liste){
  const art=notizSortierung();
  const kern=art==="eigen"
    ? (a,b)=>notizPos(a)-notizPos(b)
    : (a,b)=>sortWert(b,art)-sortWert(a,art);
  /* Angeheftetes steht immer oben, unabhängig von der gewählten Sortierung */
  return liste.slice().sort((a,b)=>(b.oben?1:0)-(a.oben?1:0)||kern(a,b));
}
/* Zeitliche Gliederung: was heute war, was diese Woche, was älter */
function zeitGruppe(n){
  if(n.oben) return "Angeheftet";
  const t=sortWert(n,notizSortierung()), d=iso(new Date(t));
  if(d===heute()) return "Heute";
  if(wochenTage(0).includes(d)) return "Diese Woche";
  const jetzt=new Date(), dat=new Date(t);
  if(dat.getFullYear()===jetzt.getFullYear()&&dat.getMonth()===jetzt.getMonth()) return "Diesen Monat";
  if(dat.getFullYear()===jetzt.getFullYear()) return MONATE[dat.getMonth()];
  return String(dat.getFullYear());
}

function notizAuswahl(){

function notizTreffer(){
  const liste=notizSuche?notizAuswahl():notizenGeordnet(notizAuswahl());
  if(!liste.length) return `<div class="leerzustand"><b>${notizSuche?"Nichts gefunden":(notizFilter==="archiv"?"Archiv ist leer":"Noch keine Notiz")}</b>
    ${notizSuche?"Andere Begriffe probieren, oder oben auf „Überall“ stellen, um das Archiv einzubeziehen.":"Mit dem Plus oben rechts legst du eine an."}</div>`;
  /* Bei eigener Reihenfolge oder Suche keine Zeitgruppen, sonst würde die Ordnung zerfallen */
  const gruppieren=!notizSuche&&notizSortierung()!=="eigen";
  if(!gruppieren) return `<div id="nbox">`+liste.map(n=>notizKarte(n,"nbox")).join("")+`</div>`;
  let letzte="", raus="";
  liste.forEach(n=>{
    const g=zeitGruppe(n);
    if(g!==letzte){ raus+=(letzte?`</div>`:"")+`<div class="gruppe">${g}</div><div id="nbox_${slug(g)}">`; letzte=g; }
    raus+=notizKarte(n,"nbox_"+slug(g));
  });
  return raus+(letzte?`</div>`:"");
}

  f.onchange=async()=>{

function bildVerkleinern(datei,maxKante,guete){
  return new Promise((ok,fehler)=>{
    const leser=new FileReader();
    leser.onerror=()=>fehler(new Error("lesen"));
    leser.onload=()=>{
      const bild=new Image();
      bild.onerror=()=>fehler(new Error("laden"));
      bild.onload=()=>{
        let {width:b,height:h}=bild;
        const f=Math.min(1,maxKante/Math.max(b,h));
        b=Math.round(b*f); h=Math.round(h*f);
        const c=document.createElement("canvas"); c.width=b; c.height=h;
        c.getContext("2d").drawImage(bild,0,0,b,h);
        ok(c.toDataURL("image/jpeg",guete));
      };
      bild.src=leser.result;
    };
    leser.readAsDataURL(datei);
  });
}

/* ===== Import aus Asana ===== */
/* Asana legt beim Export eines Projekts eine CSV an: eine Kopfzeile, darunter je
   Aufgabe eine Zeile. Felder dürfen Kommas, Zeilenumbrüche und Anführungszeichen
   enthalten - „Notes" tut das regelmäßig. Deshalb ein richtiger Leser und kein
   split(","), das an der ersten mehrzeiligen Beschreibung zerbricht. */
function csvLesen(text){
  /* Excel und Asana schreiben gern ein Byte-Order-Mark voran; es gehört nicht zum ersten Spaltennamen. */
  const s=String(text||"").replace(/^\uFEFF/,"");
  const zeilen=[]; let feld="", zeile=[], inAnf=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inAnf){
      if(c==='"'){ if(s[i+1]==='"'){ feld+='"'; i++; } else inAnf=false; }
      else feld+=c;
      continue;
    }
    if(c==='"'){ inAnf=true; continue; }
    if(c===","){ zeile.push(feld); feld=""; continue; }
    if(c==="\r") continue;
    if(c==="\n"){ zeile.push(feld); feld=""; zeilen.push(zeile); zeile=[]; continue; }
    feld+=c;
  }
  if(feld.length||zeile.length){ zeile.push(feld); zeilen.push(zeile); }
  return zeilen.filter(z=>z.some(x=>String(x==null?"":x).trim()!==""));
}

/* Asana benennt die Spalten je nach Sprache und Exportalter unterschiedlich.
   Gesucht wird deshalb nach Namen, nicht nach Positionen; was fehlt, fehlt eben. */
const ASANA_SPALTEN={
  aid:["task id","id"],
  typ:["type"],
  name:["name","task name","aufgabe"],
  notizen:["notes","description","beschreibung"],
  faellig:["due date","due on","fälligkeitsdatum","faelligkeitsdatum"],
  fertig:["completed at","completed","abgeschlossen am"],
  erstellt:["created at","erstellt am"],
  abschnitt:["section/column","section","column","abschnitt"],
  projekt:["projects","project","projekt","projekte"],
  etiketten:["tags","tag","etiketten"],
  eltern:["parent task","parent","übergeordnete aufgabe"]
};
function asanaSpalten(kopf){
  const norm=(kopf||[]).map(h=>String(h==null?"":h).trim().toLowerCase());
  const raus={};
  Object.entries(ASANA_SPALTEN).forEach(([feld,namen])=>{
    const i=norm.findIndex(h=>namen.indexOf(h)>=0);
    if(i>=0) raus[feld]=i;
  });
  return raus;
}
/* Asana schreibt Daten als „2026-08-14" oder „2026-08-14 09:12:33". Uhrzeiten
   interessieren hier nicht - die App kennt nur Tage. */
const asanaDatum=w=>{ const m=String(w==null?"":w).match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:null; };
const asanaZeit=w=>{ const d=asanaDatum(w); return d?ausIso(d).getTime():null; };
/* Mehrfachwerte stehen kommagetrennt in einem Feld; genommen wird der erste. */
const asanaErstes=w=>String(w==null?"":w).split(",")[0].trim();

function asanaLesen(name,text){
  const zeilen=csvLesen(text);
  if(zeilen.length<2) return {fehler:"keine Datenzeilen"};
  const sp=asanaSpalten(zeilen[0]);
  if(sp.name===undefined) return {fehler:"keine Spalte „Name“"};
  const aufgaben=[];
  zeilen.slice(1).forEach((z,i)=>{
    const f=k=>sp[k]===undefined?"":String(z[sp[k]]==null?"":z[sp[k]]).trim();
    const t=f("name");
    if(!t) return;
    /* Abschnitte tauchen in manchen Exporten als eigene Zeile auf. Sie sind
       keine Aufgaben, sondern die Überschrift darüber. */
    if(f("typ").toLowerCase()==="section") return;
    aufgaben.push({
      datei:name, schluessel:f("aid")||(name+"#"+i),
      aid:f("aid"), t, notiz:f("notizen"),
      faellig:asanaDatum(f("faellig")), fertig:asanaZeit(f("fertig")),
      erstellt:asanaZeit(f("erstellt")),
      abschnitt:f("abschnitt"), projekt:asanaErstes(f("projekt")),
      etikett:asanaErstes(f("etiketten")), elternRoh:f("eltern")
    });
  });
  return {aufgaben};
}

/* Die Spalte „Parent task" enthält je nach Export die Kennung, den Namen oder
   „Name (Kennung)". Alle drei werden aufgelöst; was sich nicht auflösen lässt,
   wird eine gewöhnliche Aufgabe statt einer verwaisten. */
function asanaEltern(liste){
  const nachId={}, nachName={};
  liste.forEach(a=>{ if(a.aid) nachId[a.aid]=a.schluessel; nachName[normText(a.t)]=a.schluessel; });
  const raus={};
  liste.forEach(a=>{
    const roh=a.elternRoh; if(!roh) return;
    /* Der volle Name zählt zuerst: eine Aufgabe darf „Angebot (2)" heißen. Erst
       danach wird eine angehängte Klammer als Kennung gelesen. */
    const inKlammer=(roh.match(/\((\d+)\)\s*$/)||[])[1];
    const ziel=nachId[roh]||nachName[normText(roh)]
      ||(inKlammer?nachId[inKlammer]:null)
      ||nachName[normText(roh.replace(/\s*\(\d+\)\s*$/,""))];
    if(ziel&&ziel!==a.schluessel) raus[a.schluessel]=ziel;
  });
  /* Genau eine Ebene, wie überall in dieser App: Enkel hängen sich an den
     obersten Vorfahren. Der Zähler bricht auch einen Ring auf. */
  Object.keys(raus).forEach(k=>{
    let oben=raus[k], schutz=0;
    while(raus[oben]&&schutz++<8) oben=raus[oben];
    raus[k]=oben===k?undefined:oben;
    if(!raus[k]) delete raus[k];
  });
  return raus;
}

let asanaStand=null;
/* Was von Hand aussortiert wurde. Vorgabe ist: alles kommt mit; hier steht nur,
   was ausdrücklich abgewählt ist. */
let asanaWahl={};
const asanaOpt={erledigteMit:false,listeAus:"abschnitt",alteTermine:true};
const ASANA_QUELLE={abschnitt:"Abschnitt",projekt:"Projekt",etikett:"Etikett",keine:"Keine"};

function asanaImport(){

  openSheet(asanaMaske());

  if(f){ f.value=""; f.onchange=()=>asanaDateienLesen(f.files); }
}
function asanaMaske(){
  return `<div class="sheet-kopf"><h2>Aus Asana übernehmen</h2>
      <button class="btn btn-ghost btn-s" onclick="closeSheet()" aria-label="Schließen">✕</button></div>
    <p class="note" style="margin:6px 0 12px">In Asana das Projekt öffnen, oben im Menü <b>Exportieren/Drucken → CSV</b>.
      Die Datei hier auswählen; mehrere Projekte auf einmal gehen auch.
      Unteraufgaben aus der Spalte „Parent task“ hängen sich richtig ein.</p>
    <button class="btn btn-primary btn-wide" onclick="asanaWaehlen()">Dateien auswählen</button>
    <div id="asanabericht" style="margin-top:14px">${asanaStand?asanaBericht():""}</div>`;
}
function asanaWaehlen(){ const f=document.getElementById("asanawahl"); if(f&&f.click)f.click(); }

async function asanaDateienLesen(dateien){
  const liste=[...(dateien||[])];
  if(!liste.length) return;
  const ziel=document.getElementById("asanabericht");
  if(ziel) ziel.innerHTML='<p class="note">Wird gelesen …</p>';
  const aufgaben=[], kaputt=[];
  for(const f of liste){
    try{
      const d=asanaLesen(f.name, await f.text());
      if(d.fehler) kaputt.push(f.name+" ("+d.fehler+")");
      else aufgaben.push(...d.aufgaben);
    }catch(e){ kaputt.push(f.name+" (nicht lesbar)"); }
  }
  asanaStand={dateien:liste.length,aufgaben,kaputt,eltern:asanaEltern(aufgaben)};
  asanaWahl={};
  openSheet(asanaMaske(),true);
}
/* Was nach den Schaltern überhaupt in Frage kommt - die Grundlage der Handauswahl */
function asanaMoeglich(){
  if(!asanaStand) return [];
  const alle=asanaStand.aufgaben.filter(a=>asanaOpt.erledigteMit||!a.fertig);
  /* Themen zuerst, ihre Punkte gleich darunter: nur so ist zu sehen, was
     zusammengehört, wenn man ein Thema aussortiert. */
  const kinder=k=>alle.filter(x=>asanaStand.eltern[x.schluessel]===k);
  const raus=[];
  alle.filter(a=>!asanaStand.eltern[a.schluessel]).forEach(a=>{ raus.push(a); kinder(a.schluessel).forEach(x=>raus.push(x)); });
  /* Punkte, deren Thema durch die Schalter herausgefallen ist, stehen für sich */
  alle.forEach(a=>{ if(raus.indexOf(a)<0) raus.push(a); });
  return raus;
}
function asanaAuswahl(){
  return asanaMoeglich().filter(a=>asanaWahl[a.schluessel]!==false);
}
const asanaDrin=a=>asanaWahl[a.schluessel]!==false;
/* Ein Punkt ohne sein Thema wäre zusammenhanglos, ein Thema ohne seine Punkte
   ist in Ordnung. Deshalb zieht das Abwählen nach unten und das Anwählen nach
   oben - beides genau eine Ebene weit, mehr gibt es nicht. */
function asanaSetzen(schluessel,an){
  if(!asanaStand) return;
  asanaWahl[schluessel]=an;
  if(!an) asanaStand.aufgaben.forEach(x=>{ if(asanaStand.eltern[x.schluessel]===schluessel) asanaWahl[x.schluessel]=false; });
  else { const oben=asanaStand.eltern[schluessel]; if(oben) asanaWahl[oben]=true; }
}
function asanaUm(i){
  const a=asanaMoeglich()[i]; if(!a) return;
  asanaSetzen(a.schluessel,asanaWahl[a.schluessel]===false);
  openSheet(asanaMaske(),true);
}
function asanaAlle(an){
  asanaMoeglich().forEach(a=>{ asanaWahl[a.schluessel]=an; });
  openSheet(asanaMaske(),true);
}
/* Woraus die Liste entsteht - und ob dabei überhaupt etwas herauskommt */
const asanaListenName=a=>({abschnitt:a.abschnitt,projekt:a.projekt,etikett:a.etikett,keine:""})[asanaOpt.listeAus]||"";
function asanaBericht(){

        <button class="btn btn-s" onclick="asanaAlle(false)">Keine</button>

      </div>
      <p class="note" style="margin:0 0 10px">Antippen sortiert eine Aufgabe aus oder holt sie zurück.
        Aussortiert heißt: kommt nicht in diese App - in Asana ändert sich nichts.</p>
      ${moeglich.map((a,i)=>asanaWahlzeile(a,i)).join("")}`

    <button class="btn btn-primary btn-wide" style="margin-top:14px" ${genommen.length?"":"disabled"} onclick="asanaUebernehmen()">
      ${genommen.length?"Jetzt übernehmen ("+genommen.length+")":"Nichts ausgewählt"}</button>`;
}
function asanaSchalter(feld,wert){ asanaOpt[feld]=wert; openSheet(asanaMaske(),true); }

/* Eine Zeile der Auswahl. Punkte stehen eingerückt unter ihrem Thema. */
function asanaWahlzeile(a,i){
  const oben=asanaStand.eltern[a.schluessel];
  const l=asanaListenName(a);
  const drin=asanaDrin(a);
  return `<button class="awahl ${drin?"":"aus"} ${oben?"unter":""}" onclick="asanaUm(${i})"
      aria-pressed="${drin}" aria-label="${drin?"Aussortieren":"Zurückholen"}">
    <span class="ahak">✓</span>
    <span class="atxt"><b>${esc(a.t)}</b>
      ${a.notiz?`<span class="anot">${esc(a.notiz.slice(0,90))}</span>`:""}
      <span class="nm">${l?`<span class="tag">${esc(l)}</span>`:""}
        ${a.faellig?`<span class="mini">${datumText(a.faellig)}</span>`:`<span class="mini">ohne Termin</span>`}
        ${a.fertig?`<span class="tag tag-erf">erledigt</span>`:""}</span></span>
  </button>`;
}

/* ---------- Nacheinander durchgehen ----------
   Eine Aufgabe, zwei Knöpfe. Wer zweihundert Zeilen aus Asana mitbringt, will
   sie nicht in einer Liste suchen, sondern durchgereicht bekommen. Entschieden
   wird beim Tippen; „Zurück" nimmt den letzten Griff wieder auf. */
function asanaDurchgehen(i){
  const liste=asanaMoeglich();
  if(!liste.length){ openSheet(asanaMaske(),true); return; }
  if(i>=liste.length){
    const drin=asanaAuswahl().length;
    openSheet(asanaMaske(),true);
    hinweis("Durchgegangen: "+drin+" übernommen, "+(liste.length-drin)+" aussortiert");
    return;
  }
  if(i<0) i=0;
  const a=liste[i], oben=asanaStand.eltern[a.schluessel];
  const eltern=oben?asanaStand.aufgaben.find(x=>x.schluessel===oben):null;
  const l=asanaListenName(a);
  const drin=asanaDrin(a);
  openSheet(`<div class="sheet-kopf"><h2>Übernehmen?</h2>
      <button class="btn btn-ghost btn-s" onclick="asanaDurchgehen(${liste.length})" aria-label="Durchgehen beenden">✕</button></div>
    <p class="note" style="margin:2px 0 6px">${i+1} von ${liste.length}</p>
    <div class="ubalken"><i style="width:${Math.round(i/liste.length*100)}%"></i></div>
    <div class="adurch ${drin?"":"aus"}">
      ${eltern?`<span class="mini">↳ gehört zu ${esc(eltern.t.slice(0,40))}</span>`:""}
      ${drin?"":`<span class="mini" style="color:var(--rot);font-weight:600">zurzeit aussortiert</span>`}
      <b>${esc(a.t)}</b>
      ${a.notiz?`<p class="note" style="margin:8px 0 0;white-space:pre-wrap">${esc(a.notiz.slice(0,320))}</p>`:""}
      <span class="nm" style="margin-top:10px">${l?`<span class="tag">${esc(l)}</span>`:""}
        ${a.faellig?`<span class="tag tag-akz">${datumText(a.faellig)}</span>`:`<span class="tag">ohne Termin</span>`}
        ${a.fertig?`<span class="tag tag-erf">in Asana erledigt</span>`:""}</span>
    </div>
    <div class="row-btns" style="margin-top:14px">
      <button class="btn" style="flex:1;color:var(--rot);border-color:color-mix(in srgb,var(--rot) 34%,var(--line-2))"
        onclick="asanaEntscheiden(${i},false)">Aussortieren</button>
      <button class="btn btn-primary" style="flex:1" onclick="asanaEntscheiden(${i},true)">Übernehmen</button>
    </div>
    <div class="row-btns" style="margin-top:8px">
      ${i>0?`<button class="btn btn-s btn-ghost" style="flex:1" onclick="asanaDurchgehen(${i-1})">‹ Zurück</button>`:""}
      <button class="btn btn-s btn-ghost" style="flex:1" onclick="asanaDurchgehen(${liste.length})">Rest übernehmen</button>
    </div>`,true);
}
function asanaEntscheiden(i,an){
  const liste=asanaMoeglich();
  const a=liste[i]; if(!a) return;
  asanaSetzen(a.schluessel,an);
  asanaDurchgehen(i+1);
}

function asanaUebernehmen(){
  const genommen=asanaAuswahl();
  if(!genommen.length) return;
  /* Was schon einmal aus Asana kam, kommt nicht ein zweites Mal. Die Kennung
     bleibt an der Aufgabe stehen, damit ein späterer Export dasselbe erkennt. */
  const schonDa={};
  Object.entries(S.aufgaben||{}).forEach(([id,a])=>{ if(a.asana) schonDa[a.asana]=id; });

  /* Listen anlegen, soweit nötig */
  const listeFuer={};
  [...new Set(genommen.map(asanaListenName).filter(Boolean))].forEach(e=>{
    const da=Object.entries(S.kategorien).find(([,k])=>slug(k.n)===slug(e));
    if(da){ listeFuer[e]=da[0]; return; }
    const id="k"+id6(), pos=Object.keys(S.kategorien).length;
    setPfad(S,"kategorien/"+id,{n:e,f:FARBEN[pos%FARBEN.length],art:"beides",pos});
    listeFuer[e]=id;
  });

  /* Erst alle Kennungen vergeben, dann schreiben: sonst zeigt eine Unteraufgabe
     auf eine Hauptaufgabe, die es noch nicht gibt. */
  const neu={};
  genommen.forEach(a=>{ neu[a.schluessel]=(a.aid&&schonDa[a.aid])||("a"+id6()); });

  let angelegt=0, uebersprungen=0, alsUnter=0;
  genommen.forEach(a=>{
    if(a.aid&&schonDa[a.aid]){ uebersprungen++; return; }
    const obenSchluessel=asanaStand.eltern[a.schluessel];
    const eltern=obenSchluessel?(neu[obenSchluessel]||null):null;
    let wann=a.faellig||null;
    if(wann&&asanaOpt.alteTermine&&wann<heute()) wann=null;
    const l=asanaListenName(a);
    setPfad(S,"aufgaben/"+neu[a.schluessel],{
      t:a.t, wann, kat:listeFuer[l]||null, eltern:eltern||null,
      fertig:a.fertig||null, notiz:a.notiz||null,
      erstellt:a.erstellt||Date.now(), pos:naechstePos(), ts:Date.now(),
      asana:a.aid||null
    });
    angelegt++; if(eltern) alsUnter++;
  });
  schreibenLokal();
  if(basis()) senden("",S);
  asanaStand=null; closeSheet(); go("listen");
  hinweis(angelegt+" aus Asana übernommen"+(alsUnter?", "+(alsUnter===1?"eine davon als Unteraufgabe":alsUnter+" davon als Unteraufgaben"):"")
    +(uebersprungen?", "+uebersprungen+" schon vorhanden":""));
}

/* ===== Textwerkzeug für Notizen ===== */

const ENTITAET={nbsp:" ",amp:"&",quot:'"',apos:"'",lt:"<",gt:">",auml:"ä",ouml:"ö",uuml:"ü",
  Auml:"Ä",Ouml:"Ö",Uuml:"Ü",szlig:"ß",eacute:"é",ndash:"-",mdash:"-",hellip:"…",
  bdquo:"„",ldquo:"“",rdquo:"”",lsquo:"‘",rsquo:"’",laquo:"«",raquo:"»",deg:"°",euro:"€",middot:"·"};
const entziffern=t=>String(t||"")
  .replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCodePoint(parseInt(h,16)))
  .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
  .replace(/&([a-z]+);/gi,(m,n)=>ENTITAET[n]!==undefined?ENTITAET[n]:m);

/* ===== Gerüst, Einstellungen, Start ===== */
const TABS=[
 ["heute","Heute",'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
 ["woche","Woche",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>'],
 ["listen","Listen",'<path d="M4 7h1M4 12h1M4 17h1M9 7h11M9 12h11M9 17h7"/>'],
 ["notizen","Notizen",'<path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5M8 13h8M8 17h5"/>'],
 ["mehr","Mehr",'<circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/>']
];
function nav(){
  /* Die Zahl am Reiter zählt, was abgehakt werden kann - Unteraufgaben mit.
     Gruppen braucht sie nicht, deshalb rechnet sie hier selbst. */
  const heut=heute();
  const rest=aufListe().filter(a=>offen(a)&&(a.wann===heut||(a.wann&&a.wann<heut&&/^\d{4}-/.test(a.wann)))).length;
  document.getElementById("nav").innerHTML=TABS.map(([id,l,ic])=>
    `<button onclick="go('${id}')" ${tab===id?'aria-current="page"':""}><svg viewBox="0 0 24 24">${ic}</svg>${
      id==="heute"&&rest?`<i class="badge">${rest}</i>`:""}<span>${l}</span></button>`).join("");
  const h=document.getElementById("hdside");
  if(h) h.innerHTML=basis()?`<span class="sync ${syncState==="live"?"on":syncState==="lokal"?"":"off"}"><i></i>${syncState}</span>`:"";
}
function go(t){tab=t;render();scrollTo(0,0);}
const TITEL={heute:["Heute",APP_NAME],woche:["Überblick","Woche"],listen:["Vorräte","Listen"],notizen:["Sammlung","Notizen"],mehr:["Einstellungen","Mehr"]};
function render(){
  /* Während eines Zugs bleibt das Bild stehen. Würde hier neu gezeichnet,
     hinge der Finger an einem Element, das es nicht mehr gibt. Nachgeholt wird
     es, sobald der Zug vorbei ist. */
  if(dndSperre){ dndNachholen=true; return; }
  const [eb,ti]=TITEL[tab];
  document.getElementById("eyebrow").textContent=eb;
  document.getElementById("titel").textContent=ti;
  const inhalt={heute:vHeute,woche:vWoche,listen:vListen,notizen:vNotizen,mehr:vMehr}[tab]();
  document.getElementById("view").innerHTML=inhalt;
  nav();
  hinweisRendern();
}
/* Die Reiterzeilen im Blatt rollen waagerecht. Steht das Gewählte weit rechts -
   „Benutzerdefiniert" ist der sechste Rhythmus -, sieht man ohne Zutun nicht,
   was eingestellt ist. Also holt das Blatt es beim Öffnen heran. */
function chipsHeranholen(wurzel){
  if(!wurzel||typeof wurzel.querySelectorAll!=="function") return;
  wurzel.querySelectorAll(".chips").forEach(reihe=>{
    if(!(reihe.scrollWidth>reihe.clientWidth)) return;
    const an=reihe.querySelector('.chip[aria-pressed="true"]');
    if(!an) return;
    reihe.scrollLeft=Math.max(0,an.offsetLeft-(reihe.clientWidth-an.offsetWidth)/2);
  });
}
function openSheet(html,behalten){
  const alt=document.querySelector(".sheet-in"), y=behalten&&alt?alt.scrollTop:0;
  /* Der Griff daneben schließt nichts mehr. Beim Tippen einer Beschreibung
     reichte vorher ein Fehlgriff neben das Blatt, und alles war zu. */
  document.getElementById("sheet").innerHTML=`<div class="sheet"><div class="sheet-in">${html}</div></div>`;
  document.body.style.overflow="hidden";
  if(y){const neu=document.querySelector(".sheet-in");if(neu)neu.scrollTop=y;}
  chipsHeranholen(document.getElementById("sheet"));
}
function closeSheet(){
  /* Ein noch nicht geschriebener Titel/Notiz-Rest darf beim Schließen nicht
     verloren gehen - deshalb hier sofort nachholen, solange #atxt/#anotiz
     noch existieren, statt auf die 400ms zu warten. */
  const auf=offenAuf;
  offenAuf=null;
  if(auf){ clearTimeout(aufSpeicherTimer); aufgabeMerkenSofort(auf); }
  if(offeneNotiz){notizMerkenSofort();offeneNotiz=null;}
  document.getElementById("sheet").innerHTML="";
  document.body.style.overflow=""; render();
}

/* ---------- Rückblick: was in den letzten Tagen zusammenkam ---------- */
function rueckblick(){
  const tage=[...Array(7)].map((_,i)=>iso(new Date(Date.now()-i*TAG_MS)));
  const alle=aufListe().filter(a=>a.fertig);
  return tage.map(d=>({d,n:alle.filter(a=>iso(new Date(a.fertig))===d).length}));
}
/* Zahlen allein tragen wenig. Einmal die Woche zu sehen, was tatsächlich
   zusammenkam, ist die Belohnung, wegen der die App gebaut wurde. */
function rueckblickListe(){
  const grenze=Date.now()-7*TAG_MS;
  const fertig=aufListe().filter(a=>a.fertig&&a.fertig>=grenze)
    .sort((a,b)=>b.fertig-a.fertig);
  if(!fertig.length) return `<p class="note">In den letzten sieben Tagen ist nichts abgehakt worden.</p>`;
  const nachTag={};
  fertig.forEach(a=>{const d=iso(new Date(a.fertig));(nachTag[d]=nachTag[d]||[]).push(a);});
  return Object.entries(nachTag).map(([d,liste])=>`
    <div class="rbtag">${esc(datumText(d))} · ${liste.length}</div>
    ${liste.map(a=>{
      const k=a.kat?kat(a.kat):null;
      const oben=hauptVon(a);
      return `<div class="rbzeile">${k?`<i class="punkt" style="background:${k.f}"></i>`:""}
        <s>${esc(a.t)}</s>${oben?`<span class="mini">↳ ${esc(oben.t.slice(0,22))}</span>`:""}${a.von?`<span class="mini">${esc(a.von)}</span>`:""}</div>`;}).join("")}`).join("");
}

function rueckblickZeigen(){
  openSheet(`<div class="sheet-kopf"><h2>Die letzten sieben Tage</h2>
