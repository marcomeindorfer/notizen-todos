    <div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px">
      <p class="note">Status: <b style="color:var(--ink)">${basis()?SYNCTEXT[syncState]||syncState:"nur auf diesem Gerät"}</b>${queue.length?` · ${queue.length===1?"1 Änderung wartet":queue.length+" Änderungen warten"}`:""}</p>
      ${basis()&&dauerfehler()?`<p class="note" style="color:var(--rot);font-weight:550;margin-top:6px">${SYNC_FEHLER[syncState]}</p>`:""}
      ${basis()?`<div class="row-btns" style="margin-top:8px"><button class="btn btn-s" onclick="versuche=0;verbinden();flush()">Neu verbinden</button>
        ${queue.length?`<button class="btn btn-s" onclick="flush()">Wartendes senden</button>`:""}</div>`:""}
      <label class="fl" for="gname">Dein Name auf diesem Gerät (optional)</label>
      <input type="text" id="gname" value="${esc(cfg.name||"")}" placeholder="leer lassen = anonym"
        onchange="cfg.name=this.value.trim();schreibenLokal();render()">
      <p class="note" style="margin-top:4px">Steht hier ein Name, wird beim Abhaken vermerkt, wer es war - sichtbar nur im Rückblick. Leer bleibt alles wie bisher.</p>
      <label class="fl" for="db">Datenbank-URL aus Firebase</label>
      <input type="url" id="db" value="${esc(cfg.db)}" placeholder="https://name-default-rtdb.europe-west1.firebasedatabase.app">
      <label class="fl" for="hid">Code für diese App</label>
      <input type="text" id="hid" value="${esc(cfg.hid)}" placeholder="mindestens 20 Zeichen">
      <div class="row-btns" style="margin-top:10px">
        <button class="btn btn-s" onclick="codeErzeugen()">Code erzeugen</button>
        <button class="btn btn-s btn-primary" onclick="cfgSpeichern()">Speichern und verbinden</button>
        ${basis()?`<button class="btn btn-s" onclick="hochladen()">Diesen Stand hochladen</button>`:""}
      </div>
      <p class="note" style="margin-top:11px">Beim ersten Verbinden werden beide Stände zusammengeführt: Was es nur auf einem Gerät gibt, bleibt erhalten; bei gleichen Einträgen gewinnt der jüngere. „Diesen Stand hochladen“ brauchst du deshalb nur, wenn du bewusst überschreiben willst.</p>
      <p class="note" style="margin-top:8px">Du kannst dasselbe Firebase-Projekt wie beim Küchenplan nutzen. Nimm aber einen <b>eigenen Code</b>, sonst vermischen sich die Daten beider Apps. Die vorhandenen Regeln passen unverändert.</p>
    </div>

    <div class="sect"><h2>Aufgaben teilen</h2></div>
    <div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px">
      ${cfg.partner?`
        <p class="note">Verbunden mit <b style="color:var(--ink)">${esc(cfg.partner.name)}</b>. Über den Zielknopf „Bei ${esc(cfg.partner.name)}“ in der Schnelleingabe landet eine Aufgabe direkt in ihrer/seiner Liste „Von ${esc((cfg.name||"").trim()||"mir")}“ - ohne sonst irgendwo aufzutauchen.</p>
        <p class="note" style="margin-top:4px">Hinterlegter Code: <span style="font-family:var(--mono,monospace)">${esc(cfg.partner.hid)}</span></p>
        <div class="row-btns" style="margin-top:8px">
          <button class="btn btn-s" onclick="partnerTesten()" ${partnerTestErgebnis==="prueft"?"disabled":""}>Verbindung testen</button>
          <button class="btn btn-s" onclick="partnerTrennen()">Verbindung trennen</button>
        </div>
        ${partnerTestErgebnis?`<p class="note" style="margin-top:8px">${partnerTestErgebnis==="prueft"?"Prüft …":esc(partnerTestErgebnis)}</p>`:""}
        ${gesendetUebersicht()}
      `:`
        <p class="note">Verbindet euch, um euch gegenseitig gezielt eine Aufgabe in die Liste zu schreiben - nicht die ganze App wird geteilt, nur das, was ausdrücklich zugewiesen wird. Wer den Code kennt, hätte technisch Zugriff auf den ganzen Haushalt der anderen Person, genau wie beim Verbinden zweier eigener Geräte oben - die App selbst schreibt aber ausschließlich in die eine geteilte Liste.</p>
        <label class="fl" for="pname">Name der Person</label>
        <input type="text" id="pname" placeholder="z. B. Leonie">
        <label class="fl" for="pcode">Ihr/sein Code für diese App</label>
        <input type="text" id="pcode" placeholder="mindestens 20 Zeichen">
        <button class="btn btn-s btn-primary" style="margin-top:10px" onclick="partnerVerbinden()">Verbinden</button>
        <p class="note" style="margin-top:9px">Den eigenen Code findet die andere Person oben unter „Code für diese App“ in ihrer/seiner App. Dein Name muss dafür oben gesetzt sein, sonst weiß sie nicht, von wem eine Aufgabe kommt.</p>
      `}
    </div>

    <div class="sect"><h2>Umzug aus Asana</h2></div>
    <button class="btn btn-wide" onclick="asanaImport()">Asana-Export (CSV) einlesen</button>
    <p class="note" style="margin-top:9px">Projekt in Asana öffnen, „Exportieren/Drucken → CSV“. Unteraufgaben, Termine, Beschreibungen und Abschnitte kommen mit; was schon einmal übernommen wurde, bleibt beim nächsten Mal außen vor.</p>

    <div class="sect"><h2>Sichern</h2></div>
    <div class="row-btns">
      <button class="btn btn-s" onclick="allesExportieren()">Alles als Datei sichern</button>
      <button class="btn btn-s" onclick="allesImportieren()">Sicherung einspielen</button>
    </div>

    <div class="sect"><h2>Zurücksetzen</h2></div>
    <button class="btn btn-wide" onclick="if(confirm('Wirklich alle Daten auf diesem Gerät löschen?')){localStorage.removeItem(KEY);location.reload()}">App zurücksetzen</button>
    <p class="note" style="margin-top:12px;text-align:center">${APP_NAME} ${VERSION}</p>`;
}
function altesAufraeumen(){
  const grenze=Date.now()-30*TAG_MS;
  const weg=aufListe().filter(a=>a.fertig&&a.fertig<grenze);
  if(!weg.length){alert("Nichts zum Aufräumen - alles Erledigte ist jünger als 30 Tage.");return;}
  if(!confirm(weg.length+" erledigte Aufgaben endgültig löschen?"))return;
  /* Einzeln löschen statt die ganze Sammlung zu überschreiben: nur so entsteht
     je Aufgabe ein Grabstein, und nur so bleibt stehen, was das andere Gerät
     inzwischen angelegt hat. */
  weg.forEach(a=>mut("aufgaben/"+a.id,null,false));
  render();
}
function ueberfaelligHolen(){
  const ueberfaellig=topfHeute().ueberFlach;
  if(!ueberfaellig.length){alert("Nichts ist überfällig.");return;}
  /* Einzeln schreiben: ein Rundumschlag auf alle Aufgaben würde zeitgleiche
     Änderungen des anderen Geräts überschreiben. */
  ueberfaellig.forEach(a=>aufAendern(a.id,{wann:heute()},false));
  go("heute");
}
function codeErzeugen(){
  const a="abcdefghijkmnopqrstuvwxyz23456789"; let s="";
  const r=crypto.getRandomValues(new Uint8Array(24)); r.forEach(x=>s+=a[x%a.length]);
  document.getElementById("hid").value=s;
}
function cfgSpeichern(){
  cfg.db=document.getElementById("db").value.trim().replace(/\/$/,"");
  cfg.hid=document.getElementById("hid").value.trim();
  if(cfg.hid&&cfg.hid.length<20){alert("Der Code muss mindestens 20 Zeichen haben - so verlangen es die Firebase-Regeln.");return;}
  schreibenLokal(); verbinden(); render();
}

/* ---------- Geteilte Aufgaben mit einer verbundenen Person ----------
   Beide behalten ihren eigenen Haushalt. Wer sich verbindet, kennt aber den
   Code der anderen Person und kommt damit technisch an deren ganzen Haushalt -
   genau wie beim Verbinden zweier eigener Geräte (Abschnitt „Sync"). Neu ist
   nur die Konvention: geschrieben wird ausschließlich in eine eigens dafür
   angelegte Liste „Von <Name>", die bei der anderen Person nicht von selbst
   im Tagesgeschäft auftaucht - sie muss aktiv hineinklicken. */
const eigenerSlug=()=>slug(cfg.name||"");
function partnerVerbinden(){
  const name=(document.getElementById("pname").value||"").trim();
  const code=(document.getElementById("pcode").value||"").trim();
  if(!(cfg.name||"").trim()){ alert('Trag zuerst oben „Dein Name auf diesem Gerät" ein - sonst weiß die andere Person nicht, von wem eine Aufgabe kommt.'); return; }
  if(!name){ alert("Wie heißt die Person?"); return; }
  if(code.length<20){ alert("Der Code muss mindestens 20 Zeichen haben."); return; }
  cfg.partner={hid:code,name}; partnerTestErgebnis=null; schreibenLokal(); render();
  /* Die Liste, in der die andere Person meine Aufgaben findet, richte ich bei
     ihr gleich mit ein - sie muss dafür nichts extra tun. */
  partnerSchicken("kategorien/k_von_"+eigenerSlug(),{n:"Von "+(cfg.name||"").trim(),f:"#0E6E68",art:"beides",pos:-1000})
    .then(ok=>hinweis(ok?"Mit "+name+" verbunden.":"Verbunden, aber die Liste bei "+name+" konnte gerade nicht angelegt werden - sie entsteht spätestens bei der ersten Zuweisung."));
}
function partnerTrennen(){
  if(!cfg.partner) return;
  if(!confirm("Verbindung zu "+cfg.partner.name+" wirklich trennen? Bereits zugewiesene Aufgaben bleiben bei ihr/ihm stehen.")) return;
  cfg.partner=null; schreibenLokal(); render();
}
/* Ehrliche Rückmeldung, ob der hinterlegte Code wirklich zum Haushalt der
   verbundenen Person führt - siehe partnerLesen(). Ergebnis bleibt stehen,
   bis der nächste Test läuft oder die Ansicht verlassen wird. */
let partnerTestErgebnis=null;
async function partnerTesten(){
  if(!cfg.partner) return;
  partnerTestErgebnis="prueft"; render();
  const r=await partnerLesen("");
  if(r.fehler==="kein-code") partnerTestErgebnis="Keine eigene Datenbank-URL hinterlegt - erst oben unter „Sync zwischen Geräten“ einrichten, der Code von "+cfg.partner.name+" braucht dieselbe Adresse.";
  else if(r.fehler==="verweigert") partnerTestErgebnis="Zugriff verweigert (401/403). Entweder ist der Code von "+cfg.partner.name+" falsch abgetippt, oder die Firebase-Regeln lassen ihn nicht zu.";
  else if(r.fehler==="fehlt") partnerTestErgebnis="Unter dieser Datenbank-URL antwortet niemand (404). Die Datenbank-URL selbst prüfen.";
  else if(r.fehler) partnerTestErgebnis="Verbindung fehlgeschlagen ("+r.fehler+"). Ist "+cfg.partner.name+" gerade online und die URL stimmt?";
  else if(r.daten==null) partnerTestErgebnis="Die Verbindung klappt technisch, aber unter diesem Code liegt noch gar nichts. Prüft, ob das wirklich "+cfg.partner.name+"s Code ist und nicht z. B. ein Beispiel- oder Testcode.";
  else {
    const katId="k_von_"+eigenerSlug();
    const katDa=!!(r.daten.kategorien&&r.daten.kategorien[katId]);
    const anzahlAufgaben=Object.keys(r.daten.aufgaben||{}).length;
    partnerTestErgebnis="Verbindung erreichbar: insgesamt "+anzahlAufgaben+" "+(anzahlAufgaben===1?"Aufgabe":"Aufgaben")+" im Haushalt von "+cfg.partner.name+". Liste „Von "+((cfg.name||"").trim()||"mir")+"“ "
      +(katDa?"ist dort angelegt.":"fehlt dort - das erklärt, warum Zuweisungen nicht auftauchen. Einmal „Verbindung trennen“ und neu verbinden, dann wird sie erneut angelegt.");
  }
  render();
}
/* Aufgabe direkt in den Haushalt der verbundenen Person schreiben, in deren
   reservierte Liste „Von <mein Name>". Bewusst ohne Datum, Wiederholung oder
   Listen-Tag: die App der anderen Person kennt meine Listen nicht, und die
   Aufgabe soll ohnehin erst nach einem bewussten Blick in diese Liste in
   ihren Tag wandern - nicht von selbst im Tagesgeschäft auftauchen. */
async function aufgabeFuerPartner(text){
  const t=text.trim(); if(!t||!cfg.partner) return;
  /* Ohne dieses Netz verschwand ein unerwarteter Fehler bisher spurlos: die
     Funktion läuft als "fire and forget" aus schnellAnlegen() heraus, eine
     Ablehnung ohne .catch() zeigt sich nirgends in der Oberfläche - weder
     Erfolgs- noch Fehlermeldung. */
  try{
    const id="a"+id6();
    const eigenerName=(cfg.name||"").trim();
    const katId="k_von_"+eigenerSlug();
    const partnerName=cfg.partner.name;    /* vor dem await sichern, falls sich cfg.partner währenddessen ändert */
    const a={t,wann:null,kat:katId,eltern:null,fertig:null,herkunft:eigenerName,erstellt:Date.now(),pos:naechstePos(),ts:Date.now()};
    const ok=await partnerSchicken("aufgaben/"+id,a);
    mut("gesendet/"+id,{t,an:partnerName,erstellt:Date.now(),erledigt:null,ts:Date.now()},false);
    hinweis(ok?"An "+partnerName+" geschickt.":"Konnte gerade nicht an "+partnerName+" gesendet werden.",
      ok?null:"Erneut versuchen",
      ok?null:()=>{ partnerSchicken("aufgaben/"+id,a).then(o2=>hinweis(o2?"An "+partnerName+" geschickt.":"Noch immer nicht erreichbar.")); });
  }catch(e){
    alert("Beim Zuweisen ist etwas schiefgelaufen: "+(e&&e.message?e.message:e));
  }
}
/* Kurze Übersicht unter „Mehr": was wurde zugewiesen, was ist noch offen. */
function gesendetUebersicht(){
  const liste=Object.entries(S.gesendet||{}).map(([id,g])=>({...g,id})).sort((a,b)=>b.erstellt-a.erstellt).slice(0,8);
  if(!liste.length) return "";
  const offen=liste.filter(g=>!g.erledigt).length;
  return `<div style="margin-top:12px">
    <p class="note"><b style="color:var(--ink)">${offen}</b> ${offen===1?"zugewiesene Aufgabe noch offen":"zugewiesene Aufgaben noch offen"}.</p>
    ${liste.map(g=>`<div class="rbzeile">${g.erledigt?`<s>${esc(g.t)}</s>`:`<span>${esc(g.t)}</span>`}<span class="mini">${esc(g.an)}</span></div>`).join("")}
  </div>`;
}
async function hochladen(){
  if(!confirm("Den Stand dieses Geräts in die Datenbank schreiben? Ein dort vorhandener Stand wird überschrieben."))return;
  await senden("",S); render();
}
function allesExportieren(){
  const daten=JSON.stringify(S,null,1);
  openSheet(`<div class="grab"></div><h2 style="font-size:19px">Sicherung</h2>
    <p class="note" style="margin:8px 0 12px">Text kopieren und ablegen. Enthält Aufgaben, Notizen und Listen samt Bildern.</p>
    <textarea rows="12" onclick="this.select()">${esc(daten)}</textarea>
    <button class="btn btn-wide btn-ghost" style="margin-top:8px" onclick="closeSheet()">Schließen</button>`);
}
function allesImportieren(){
  openSheet(`<div class="grab"></div><h2 style="font-size:19px">Sicherung einspielen</h2>
    <p class="note" style="margin:8px 0 12px">Ersetzt den aktuellen Stand vollständig.</p>
    <textarea id="imp" rows="10" placeholder='{ "aufgaben": … }'></textarea>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="importAusfuehren()">Einspielen</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Abbrechen</button>`);
}
function importAusfuehren(){
  let d;
  try{ d=JSON.parse(document.getElementById("imp").value); }
  catch(e){ alert("Das ist kein gültiges JSON."); return; }
  if(!d||typeof d!=="object"||(!d.aufgaben&&!d.notizen)){alert("Darin stecken weder Aufgaben noch Notizen.");return;}
  if(!confirm("Aktuellen Stand ersetzen?"))return;
  S={...leer(),...d}; aufgabenVersion++;
  schreibenLokal(); if(basis())senden("",S);
  closeSheet(); go("heute");
}

/* ---------- Geteilte Inhalte aufnehmen ---------- */
function shareAufnehmen(){
  const p=new URLSearchParams(location.search);
  const url=p.get("url")||"", titel=p.get("title")||"", text=p.get("text")||"";
  if(!url&&!titel&&!text) return false;
  history.replaceState({},"",location.pathname);
  const inhalt=[titel,text,url].filter(Boolean).join("\n");
  openSheet(`<div class="sheet-kopf"><h2>Geteiltes übernehmen</h2><button class="btn btn-ghost btn-s" onclick="closeSheet()">✕</button></div>
    <p class="note" style="margin:8px 0 12px">Als schnelle Aufgabe oder als Notiz mit dem vollen Text.</p>
    <textarea id="geteilt" rows="5">${esc(inhalt)}</textarea>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="geteiltAlsAufgabe()">Als Aufgabe</button>
    <button class="btn btn-wide" style="margin-top:6px" onclick="geteiltAlsNotiz()">Als Notiz</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Verwerfen</button>`);
  return true;
}
function geteiltAlsAufgabe(){
  const t=document.getElementById("geteilt").value.split("\n")[0];
  aufgabeAnlegen(t,null,null); closeSheet(); go("listen");
}
function geteiltAlsNotiz(){
  const roh=document.getElementById("geteilt").value;
  const zeilen=roh.split("\n").filter(Boolean);
  const id="n"+id6();
  mut("notizen/"+id,{titel:zeilen[0]||"Geteilt",html:zeilen.map(z=>"<p>"+esc(z)+"</p>").join(""),
    kat:null,art:"frei",archiv:false,erstellt:Date.now(),geaendert:Date.now()},false);
  closeSheet(); go("notizen"); notizOeffnen(id);
}

/* ---------- Der Plus-Knopf tritt zur Seite ----------
   Er schwebt über dem Inhalt und stand damit ständig auf irgendeiner Zeile.
   Beim Blättern nach unten liest man, beim Blättern nach oben will man
   eintragen: also verschwindet er beim Lesen und kommt zurück, sobald man
   umkehrt. Ganz oben ist er immer da, und unter dem Inhalt steht so viel Luft,
   dass er am Seitenende nichts mehr verdeckt. */
let letzteHoehe=0;
function daumenMitlaufen(){
  const k=document.getElementById("daumen"); if(!k||!k.classList) return;
  const y=Math.max(0,typeof scrollY==="number"?scrollY:0);
  if(y>letzteHoehe+4&&y>90) k.classList.add("weg");        /* nach unten: lesen */
  else if(y<letzteHoehe-4||y<=90) k.classList.remove("weg"); /* nach oben: eintragen */
  letzteHoehe=y;
}

/* ---------- Start ---------- */
if(typeof document!=="undefined"&&document.getElementById){
  lesenLokal();
  render();
  shareAufnehmen();
  if(basis())verbinden();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  addEventListener("scroll",daumenMitlaufen,{passive:true});
  /* Tageswechsel im Hintergrund abfangen, damit "Heute" stimmt */
  let letzterTag=heute();
  setInterval(()=>{
    if(heute()!==letzterTag){letzterTag=heute();render();}
    syncPruefen();
  },30000);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible"){
      /* Sicherheitsnetz für das Mikrotask-Sammelbecken in schreibenLokal():
         verschwindet die Seite (Tab-Wechsel, App zu), wird sofort geschrieben,
         statt auf den nächsten Aufruf zu warten. */
      if(schreibenAusstehend) schreibenSofort();
      return;
    }
    if(heute()!==letzterTag){letzterTag=heute();render();}
    syncPruefen();
  });
  addEventListener("pagehide",()=>{ if(schreibenAusstehend) schreibenSofort(); });
}

</script>
</body>
</html>
