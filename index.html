    <div class="sect"><h2>Zurücksetzen</h2></div>
    <button class="btn btn-wide" onclick="if(confirm('Wirklich alle Daten auf diesem Gerät löschen?')){localStorage.removeItem(KEY);location.reload()}">App zurücksetzen</button>
    <p class="note" style="margin-top:12px;text-align:center">${APP_NAME} ${VERSION}</p>`;
}
function altesAufraeumen(){
  const grenze=Date.now()-30*TAG_MS;
  const weg=aufListe().filter(a=>a.fertig&&a.fertig<grenze);
  if(!weg.length){alert("Nichts zum Aufräumen – alles Erledigte ist jünger als 30 Tage.");return;}
  if(!confirm(weg.length+" erledigte Aufgaben endgültig löschen?"))return;
  const rest={...S.aufgaben}; weg.forEach(a=>delete rest[a.id]);
  mut("aufgaben",rest);
}
function ueberfaelligHolen(){
  const {ueberfaellig}=topfHeute();
  if(!ueberfaellig.length){alert("Nichts ist überfällig.");return;}
  /* Einzeln schreiben: ein Rundumschlag auf alle Aufgaben würde zeitgleiche
     Änderungen des anderen Geräts überschreiben. */
  ueberfaellig.forEach(a=>aufAendern(a.id,{wann:heute()},false));
  go("heute");
}
function codeErzeugen(){
  const a="abcdefghijkmnopqrstuvwxyz23456789"; let s="";
  const r=crypto.getRandomValues(new Uint8Array(24)); r.forEach(x=>s+=a[x%a.length]);
  document.getElementById("hid").value=s;
}
function cfgSpeichern(){
  cfg.db=document.getElementById("db").value.trim().replace(/\/$/,"");
  cfg.hid=document.getElementById("hid").value.trim();
  if(cfg.hid&&cfg.hid.length<20){alert("Der Code muss mindestens 20 Zeichen haben – so verlangen es die Firebase-Regeln.");return;}
  schreibenLokal(); verbinden(); render();
}
async function hochladen(){
  if(!confirm("Den Stand dieses Geräts in die Datenbank schreiben? Ein dort vorhandener Stand wird überschrieben."))return;
  await senden("",S); render();
}
function allesExportieren(){
  const daten=JSON.stringify(S,null,1);
  openSheet(`<div class="grab"></div><h2 style="font-size:19px">Sicherung</h2>
    <p class="note" style="margin:8px 0 12px">Text kopieren und ablegen. Enthält Aufgaben, Notizen und Listen samt Bildern.</p>
    <textarea rows="12" onclick="this.select()">${esc(daten)}</textarea>
    <button class="btn btn-wide btn-ghost" style="margin-top:8px" onclick="closeSheet()">Schließen</button>`);
}
function allesImportieren(){
  openSheet(`<div class="grab"></div><h2 style="font-size:19px">Sicherung einspielen</h2>
    <p class="note" style="margin:8px 0 12px">Ersetzt den aktuellen Stand vollständig.</p>
    <textarea id="imp" rows="10" placeholder='{ "aufgaben": … }'></textarea>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="importAusfuehren()">Einspielen</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Abbrechen</button>`);
}
function importAusfuehren(){
  let d;
  try{ d=JSON.parse(document.getElementById("imp").value); }
  catch(e){ alert("Das ist kein gültiges JSON."); return; }
  if(!d||typeof d!=="object"||(!d.aufgaben&&!d.notizen)){alert("Darin stecken weder Aufgaben noch Notizen.");return;}
  if(!confirm("Aktuellen Stand ersetzen?"))return;
  S={...leer(),...d};
  schreibenLokal(); if(basis())senden("",S);
  closeSheet(); go("heute");
}

/* ---------- Geteilte Inhalte aufnehmen ---------- */
function shareAufnehmen(){
  const p=new URLSearchParams(location.search);
  const url=p.get("url")||"", titel=p.get("title")||"", text=p.get("text")||"";
  if(!url&&!titel&&!text) return false;
  history.replaceState({},"",location.pathname);
  const inhalt=[titel,text,url].filter(Boolean).join("\n");
  openSheet(`<div class="sheet-kopf"><h2>Geteiltes übernehmen</h2><button class="btn btn-ghost btn-s" onclick="closeSheet()">✕</button></div>
    <p class="note" style="margin:8px 0 12px">Als schnelle Aufgabe oder als Notiz mit dem vollen Text.</p>
    <textarea id="geteilt" rows="5">${esc(inhalt)}</textarea>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="geteiltAlsAufgabe()">Als Aufgabe</button>
    <button class="btn btn-wide" style="margin-top:6px" onclick="geteiltAlsNotiz()">Als Notiz</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Verwerfen</button>`);
  return true;
}
function geteiltAlsAufgabe(){
  const t=document.getElementById("geteilt").value.split("\n")[0];
  aufgabeAnlegen(t,null,null); closeSheet(); go("listen");
}
function geteiltAlsNotiz(){
  const roh=document.getElementById("geteilt").value;
  const zeilen=roh.split("\n").filter(Boolean);
  const id="n"+id6();
  mut("notizen/"+id,{titel:zeilen[0]||"Geteilt",html:zeilen.map(z=>"<p>"+esc(z)+"</p>").join(""),
    kat:null,art:"frei",archiv:false,erstellt:Date.now(),geaendert:Date.now()},false);
  closeSheet(); go("notizen"); notizOeffnen(id);
}

/* ---------- Start ---------- */
if(typeof document!=="undefined"&&document.getElementById){
  lesenLokal();
  render();
  shareAufnehmen();
  if(basis())verbinden();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  /* Tageswechsel im Hintergrund abfangen, damit "Heute" stimmt */
  let letzterTag=heute();
  setInterval(()=>{
    if(heute()!==letzterTag){letzterTag=heute();render();}
    syncPruefen();
  },30000);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible") return;
    if(heute()!==letzterTag){letzterTag=heute();render();}
    syncPruefen();
  });
}

</script>
</body>
